<style>
/* Layout: full-screen canvas game; floating rounded HUD cards; bottom dialog box. Single bright cartoon look in both themes. */
:root{
  --sea:#1f7fc4; --panel:#fffaf0; --panel2:#ffe9c7; --ink:#3a2a4d; --accent:#ff5fa2; --accent2:#7b5cff;
  --good:#2fbf71; --bad:#ff5e57; --gold:#ffc53d; --muted:#8a7a99;
  --font:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--sea);color:var(--ink);font-family:var(--font);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
input{user-select:text;-webkit-user-select:text;touch-action:manipulation}
#game{position:fixed;inset:0;display:block}
.hidden{display:none!important}
.card{background:color-mix(in srgb,var(--panel) 92%,transparent);border-radius:16px;box-shadow:0 4px 0 rgba(58,42,77,.25),0 8px 20px rgba(0,0,0,.15);padding:6px 12px;border:3px solid #fff}
button{font-family:var(--font);cursor:pointer;border:none;color:var(--ink);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}

#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud > *{pointer-events:auto}
#topLeft{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));max-width:44vw}
#who{font-weight:800;font-size:18px;line-height:1.1}
#petsRow{font-size:22px;letter-spacing:2px;line-height:1.2}
#race{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);text-align:center;font-weight:700;font-size:14px;white-space:nowrap}
#race .bar{display:flex;gap:3px;justify-content:center;font-size:15px}
#topRight{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mini{width:170px;height:120px;border-radius:12px;border:3px solid #fff;box-shadow:0 4px 0 rgba(58,42,77,.25);background:#1f7fc4;cursor:pointer}
#weatherTag{font-weight:700;font-size:14px}
#invBar{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px;font-size:18px;font-weight:700;max-width:70vw;overflow:hidden;white-space:nowrap}
#invBar:empty{display:none}
#btns{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.rbtn{width:48px;height:48px;border-radius:50%;font-size:24px;background:var(--panel);box-shadow:0 4px 0 rgba(58,42,77,.3);border:3px solid #fff}
.rbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(58,42,77,.3)}
#touch{display:none}
body.touch #touch{display:block}
#stick{position:fixed;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.7);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:calc(50% - 25px);top:calc(50% - 25px);pointer-events:none;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.tbtn{position:fixed;width:72px;height:72px;border-radius:50%;font-size:22px;font-weight:800;line-height:1;background:var(--gold);border:4px solid #fff;box-shadow:0 4px 0 rgba(58,42,77,.35);pointer-events:auto}
.tbtn small{font-size:12px}
#tE{right:max(20px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px))}
#tF{right:max(104px,calc(env(safe-area-inset-right,0px) + 84px));bottom:calc(80px + env(safe-area-inset-bottom,0px));background:#9fe3ff}
body.touch #invBar{bottom:calc(170px + env(safe-area-inset-bottom,0px))}

#toasts{position:fixed;top:calc(108px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;font-weight:700;padding:6px 16px;border-radius:999px;font-size:16px;animation:pop .25s ease-out;box-shadow:0 4px 12px rgba(0,0,0,.25);text-align:center;max-width:90vw}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

#dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(660px,calc(100vw - 24px));z-index:20;background:var(--panel);border:4px solid #fff;border-radius:22px;box-shadow:0 6px 0 rgba(58,42,77,.3),0 12px 30px rgba(0,0,0,.25);padding:12px 18px 14px}
#dhead{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--accent2)}
#demoji{font-size:34px;line-height:1}
#dtext{font-size:19px;line-height:1.35;margin:6px 0 10px;font-weight:500;min-height:2.6em}
#dchoices{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.choice{background:var(--accent);color:#fff;font-weight:800;font-size:17px;padding:6px 16px;border-radius:999px;box-shadow:0 4px 0 #c93c7c}
.choice.alt{background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 #d9b98a}
.choice:active{transform:translateY(2px);box-shadow:0 2px 0 #c93c7c}
.choice .k{opacity:.7;font-size:13px;margin-right:4px}

#battleUI{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);border-top:4px solid #fff;box-shadow:0 -6px 20px rgba(0,0,0,.2);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#bmsg{font-weight:700;font-size:18px;min-height:28px;margin-bottom:8px;text-align:center}
#bbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.bbtn{background:#fff;border:3px solid var(--accent2);border-radius:14px;padding:6px 12px;font-size:16px;font-weight:700;box-shadow:0 4px 0 var(--accent2);min-width:120px}
.bbtn .p{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.bbtn:disabled{opacity:.45;cursor:default}
.bbtn.main{border-color:var(--accent);box-shadow:0 4px 0 var(--accent)}
.bbtn.snack{border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.bbtn:not(:disabled):active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent2)}

#overlay{position:fixed;inset:0;z-index:30;background:rgba(30,20,50,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#ovBox{touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--panel);border:4px solid #fff;border-radius:22px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:16px 20px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#ovBox h2{margin:0 0 6px;font-size:26px;color:var(--accent2)}
#ovBox h3{margin:12px 0 4px;font-size:19px}
.petCard{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:6px 10px;margin:6px 0}
.petCard .pe{font-size:34px;width:46px;text-align:center}
.petCard.locked{opacity:.6}
.petCard b{font-size:17px}
.petCard div{font-size:14px;line-height:1.25}
.items{display:flex;flex-wrap:wrap;gap:8px;font-size:18px;font-weight:700}
.items span{background:#fff;border-radius:12px;padding:2px 10px}
.closeBtn{float:right;background:var(--accent);color:#fff;font-weight:800;border-radius:999px;padding:4px 14px;font-size:16px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:16px}
.keys kbd{background:#fff;border-radius:8px;padding:0 8px;font-family:var(--font);font-weight:800;border:2px solid #d9c8ef;white-space:nowrap}
#mapCanvas{width:100%;height:auto;border-radius:14px;border:3px solid #fff;display:block}

#title{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 50% 30%,#7fd8ff,#1f7fc4 70%)}
#tbox{background:var(--panel);border:5px solid #fff;border-radius:28px;padding:20px 24px;max-width:560px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(58,42,77,.3),0 20px 60px rgba(0,0,0,.3)}
#tbox h1{margin:0;font-size:clamp(34px,8vw,54px);line-height:1;color:var(--accent);text-shadow:3px 3px 0 #fff,5px 5px 0 rgba(123,92,255,.35)}
#tbox .sub{font-size:18px;margin:6px 0 12px}
#tbox .parade{font-size:34px;letter-spacing:4px;margin-bottom:8px}
#chars{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.charBtn{font-size:36px;width:62px;height:62px;border-radius:16px;background:#fff;border:3px solid #e6dcf5}
.charBtn.sel{border-color:var(--accent);background:#ffe6f2;transform:scale(1.08)}
#nameIn{font-family:var(--font);font-size:20px;font-weight:700;padding:6px 12px;border-radius:12px;border:3px solid #e6dcf5;text-align:center;width:220px;max-width:100%;color:var(--ink);background:#fff}
.bigBtn{background:var(--accent);color:#fff;font-weight:800;font-size:22px;padding:8px 26px;border-radius:999px;box-shadow:0 5px 0 #c93c7c;margin:12px 6px 0}
.bigBtn.alt{background:var(--accent2);box-shadow:0 5px 0 #5638d6}
@media (max-width:640px){
  #mini{width:110px;height:78px}
  #race{top:auto;bottom:calc(66px + env(safe-area-inset-bottom,0px));font-size:12px}
  body.touch #race{bottom:auto;top:calc(146px + env(safe-area-inset-top,0px));left:auto;right:max(10px,env(safe-area-inset-right,0px));transform:none}
  #who{font-size:15px}#petsRow{font-size:18px}
  #dtext{font-size:17px}
}
.tbtn.ready{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 4px 0 rgba(58,42,77,.35),0 0 0 0 rgba(255,197,61,.8)}to{box-shadow:0 4px 0 rgba(58,42,77,.35),0 0 0 10px rgba(255,197,61,0)}}
/* tablets: bigger thumbs-friendly controls */
@media (min-width:641px){
  body.touch #stick{width:170px;height:170px;bottom:calc(30px + env(safe-area-inset-bottom,0px))}
  body.touch #knob{width:64px;height:64px;left:calc(50% - 32px);top:calc(50% - 32px)}
  body.touch .tbtn{width:92px;height:92px;font-size:30px}
  body.touch .tbtn small{font-size:15px}
  body.touch #tE{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  body.touch #tF{right:max(126px,calc(env(safe-area-inset-right,0px) + 106px));bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  body.touch .rbtn{width:56px;height:56px;font-size:28px}
  body.touch #invBar{bottom:calc(200px + env(safe-area-inset-bottom,0px))}
  body.touch .bbtn{font-size:19px;padding:10px 16px;min-width:150px}
  body.touch .choice{font-size:20px;padding:10px 22px}
}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.tbtn.ready{animation:none}}
</style>

<canvas id="game"></canvas>

  <div id="topLeft" class="card"><div id="who"></div><div id="petsRow"></div></div>

</div>
<div id="toasts"></div>
<div id="dialog" class="hidden"><div id="dhead"><span id="demoji"></span><span id="dname"></span></div><div id="dtext"></div><div id="dchoices"></div></div>
<div id="battleUI" class="hidden"><div id="bmsg"></div><div id="bbtns"></div></div>
<div id="overlay" class="hidden"><div id="ovBox"></div></div>

</div>

<script>
(()=>{
'use strict';
// ================= helpers =================
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const srng=mulberry32(20261115);
const hash=(x,y)=>{let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return ((h^(h>>>16))>>>0)};

// ================= canvas & sprites =================
const cv=$('game'),ctx=cv.getContext('2d');
let VW=0,VH=0,DPR=1,ZOOM=1,RES=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);cv.style.width=VW+'px';cv.style.height=VH+'px';ZOOM=clamp(Math.min(VW/1000,VH/700)*1.3,0.7,1.6);}
addEventListener('resize',resize);resize();
const EMOJI_FONT='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
const spriteCache=new Map();
function sprite(e,px){const k=e+'|'+px;let c=spriteCache.get(k);if(c)return c;c=document.createElement('canvas');const s=Math.ceil(px*1.4);c.width=c.height=s;const g=c.getContext('2d');g.font=`${px}px ${EMOJI_FONT}`;g.textAlign='center';g.textBaseline='middle';g.fillText(e,s/2,s/2+px*0.07);spriteCache.set(k,c);return c;}
function drawEmoji(e,x,y,size,flip=false,alpha=1){const px=Math.max(8,Math.min(512,Math.round(size*RES/4)*4));const c=sprite(e,px);const d=size*1.4;
  if(!flip&&alpha===1){ctx.drawImage(c,x-d/2,y-d/2,d,d);return;}
  ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x,y);if(flip)ctx.scale(-1,1);ctx.drawImage(c,-d/2,-d/2,d,d);ctx.restore();}
function label(text,x,y,size=11,color='#fff'){ctx.font=`800 ${size}px ${'"Baloo 2","Comic Sans MS",sans-serif'}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=size*0.35;ctx.strokeStyle='rgba(40,25,60,.85)';ctx.lineJoin='round';ctx.strokeText(text,x,y);ctx.fillStyle=color;ctx.fillText(text,x,y);}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// ================= sound =================
let AC=null,muted=false;
function tone(f,d=0.12,type='sine',v=0.07,slide=0,delay=0){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+0.03);}catch(e){}}
function noise(d=0.8,v=0.25){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*d,buf=AC.createBuffer(1,n,AC.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=AC.createBufferSource();s.buffer=buf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=400;const g=AC.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();}catch(e){}}
const SFX={
  pick(){tone(880,.08,'sine',.07);tone(1320,.1,'sine',.06,0,.06)},
  talk(){tone(540,.06,'triangle',.05)},
  hit(){tone(220,.18,'square',.05,-140)},
  heal(){tone(660,.12,'sine',.06);tone(990,.16,'sine',.06,0,.08)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.08,0,i*.12))},
  unlock(){[784,988,1175,1568].forEach((f,i)=>tone(f,.18,'sine',.07,0,i*.09))},
  lose(){[440,392,330].forEach((f,i)=>tone(f,.25,'triangle',.06,0,i*.18))},
  fly(){tone(300,.3,'sine',.05,500)},
  boat(){tone(200,.25,'sine',.05,100)},
  thunder(){noise(1.2,.35)},
  zap(){tone(1200,.12,'sawtooth',.03,-800)},
};

// ================= data =================
const T=32,MW=170,MH=120;
const CROPS={
  carrot:{e:'🥕',n:'Carrot',heal:20}, strawberry:{e:'🍓',n:'Strawberry',heal:15}, tomato:{e:'🍅',n:'Tomato',heal:15},
  corn:{e:'🌽',n:'Corn',heal:20}, apple:{e:'🍎',n:'Apple',heal:18}, watermelon:{e:'🍉',n:'Watermelon',heal:35},
  pumpkin:{e:'🎃',n:'Pumpkin',heal:30}, grapes:{e:'🍇',n:'Grapes',heal:15}, banana:{e:'🍌',n:'Banana',heal:20},
};
const PETS={
  dog:{e:'🐶',short:'Buddy',name:'Buddy the Dog',power:'Bark Blast',desc:'A giant bark! Often makes the other side too surprised to move.',world:'Sniffs out yummy veggies.'},
  cat:{e:'🐱',short:'Whiskers',name:'Whiskers the Cat',power:'Lucky Purr',desc:'Heals you a little and makes you dodge the next attack.',world:'Always lands on her feet.'},
  unicorn:{e:'🦄',short:'Sparkle',name:'Sparkle the Unicorn',power:'Rainbow Beam',desc:'A super strong rainbow blast!',world:'Leaves a trail of sparkles.'},
  cheetah:{e:'🐆',badge:'⚡',short:'Zoom',name:'Zoom the Cheetah',power:'Speed Dash',desc:'Zooms in and hits 3 times super fast.',world:'Makes you walk faster!'},
  leopard:{e:'🐆',short:'Spots',name:'Spots the Leopard',power:'Jungle Pounce',desc:'A huge pounce. Sometimes a DOUBLE hit!',world:'Great at climbing.'},
  fish:{e:'🐠',bubble:true,short:'Bubbles',name:'Bubbles the Fish',power:'Bubble Shield',desc:'Blocks the next 2 attacks.',world:'Floats along in a magic bubble.'},
  penguin:{e:'🐧',short:'Waddles',name:'Waddles the Penguin',power:'Ice Slide',desc:'Slides in and freezes the other side for a turn.',world:'Loves the snow.'},
  bunny:{e:'🐰',short:'Hops',name:'Hops the Bunny',power:'Carrot Heal',desc:'Heals a LOT of your energy.',world:'Hop hop hop!'},
  dragon:{e:'🐲',short:'Ember',name:'Ember the Baby Dragon',power:'Star Breath',desc:'The strongest power of all!',world:'Was the Shadow Dragon — now a happy friend.'},
};
const PET_ORDER=['dog','cat','unicorn','cheetah','leopard','fish','penguin','bunny','dragon'];
const PET_HINT={cat:'Lives on Kitty Cove (northwest).',unicorn:'Lives on Sparkle Island. Loves strawberries 🍓.',cheetah:'Lives on Savanna Island. Only joins winners ⚔️.',leopard:'Lives on Savanna Island. Hungry for corn 🌽.',fish:'Lives at Coral Reef (south of Savanna).',penguin:'Lives on Frosty Island. Joins champions with 3 wins.',bunny:'Lives on Bunny Burrow (south of Home). Loves carrots 🥕.',dragon:'Beat the Shadow Dragon to find out...'};

const ISLANDS=[
 {id:'home',name:'Home Island',x:40,y:60,r:13,biome:'grass',boats:[0,Math.PI/2,-2.3],

const N=MW*MH;
const terr=new Uint8Array(N),isl=new Int8Array(N).fill(-1),deco=new Uint8Array(N),solid=new Uint8Array(N),reserved=new Uint8Array(N),dvar=new Uint8Array(N);
ISLANDS.forEach(I=>{I.s1=srng()*6.28;I.s2=srng()*6.28;I.s3=srng()*6.28;});
for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
  let best=9,bi=-1;
  for(let k=0;k<ISLANDS.length;k++){const I=ISLANDS[k];const dx=x+.5-I.x,dy=y+.5-I.y,d=Math.hypot(dx,dy);if(d>I.r*1.9)continue;const a=Math.atan2(dy,dx);const re=I.r*(1+.15*Math.sin(3*a+I.s1)+.08*Math.sin(5*a+I.s2)+.05*Math.sin(9*a+I.s3));const nd=d/re;if(nd<best){best=nd;bi=k;}}
  const i=y*MW+x;terr[i]=best<.78?3:best<1?2:best<1.4?1:0;if(terr[i]>0)isl[i]=bi;dvar[i]=hash(x,y)%97;
}
function forceLand(tx,ty,rad,k){for(let y=ty-rad;y<=ty+rad;y++)for(let x=tx-rad;x<=tx+rad;x++){if(x<0||y<0||x>=MW||y>=MH)continue;const i=y*MW+x;if(terr[i]<3){terr[i]=3;isl[i]=k;}}}
function reserve(tx,ty,rad){for(let y=ty-rad;y<=ty+rad;y++)for(let x=tx-rad;x<=tx+rad;x++){if(x<0||y<0||x>=MW||y>=MH)continue;reserved[y*MW+x]=1;}}
function markSolid(x0,y0,x1,y1){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(x>=0&&y>=0&&x<MW&&y<MH)solid[y*MW+x]=1;}
const NPCS=[],ANIMALS=[],PLANTS=[],BUILDINGS=[],BOATS=[];
let BOSS=null;
ISLANDS.forEach((I,k)=>{
  const c=(dx,dy)=>({tx:I.x+dx,ty:I.y+dy,x:(I.x+dx+.5)*T,y:(I.y+dy+.5)*T});
  const st=c(0,1);forceLand(st.tx,st.ty,1,k);reserve(st.tx,st.ty,1);I.cx=st.x;I.cy=st.y;
  (I.feats||[]).forEach(f=>{const p=c(f.dx,f.dy);const b={...f,...p,island:k};
    if(f.k==='house'){forceLand(p.tx,p.ty,2,k);reserve(p.tx,p.ty,3);markSolid(p.tx-1,p.ty-1,p.tx+1,p.ty);b.door={x:p.x,y:p.y+T*1.1};}
    if(f.k==='museum'){forceLand(p.tx,p.ty,2,k);reserve(p.tx,p.ty,3);markSolid(p.tx-1,p.ty-1,p.tx+1,p.ty);b.door={x:p.x,y:p.y+T*1.1};}
    if(f.k==='volcano'){forceLand(p.tx,p.ty,3,k);reserve(p.tx,p.ty,4);markSolid(p.tx-2,p.ty-2,p.tx+2,p.ty+1);
      const bp=c(0,f.dy+4);forceLand(bp.tx,bp.ty,1,k);reserve(bp.tx,bp.ty,2);BOSS={x:bp.x,y:bp.y,island:k};}
    BUILDINGS.push(b);});
  (I.npcs||[]).forEach(n=>{const p=c(n.dx,n.dy);forceLand(p.tx,p.ty,1,k);reserve(p.tx,p.ty,1);NPCS.push({...n,...p,island:k,li:0});});
  [I.animal,I.animal2].forEach(a=>{if(!a)return;const p=c(a.dx,a.dy);forceLand(p.tx,p.ty,1,k);reserve(p.tx,p.ty,1);ANIMALS.push({...a,...p,island:k});});
  if(I.garden){I.garden.crops.forEach((cr,j)=>{const p=c(I.garden.dx+j%4,I.garden.dy+Math.floor(j/4));forceLand(p.tx,p.ty,1,k);reserve(p.tx,p.ty,0);PLANTS.push({type:cr,x:p.x,y:p.y,tx:p.tx,ty:p.ty,ripe:true,t:0});});}
});
// trees & decorations
for(let i=0;i<N;i++){
  if(terr[i]!==3||reserved[i]||solid[i])continue;const I=ISLANDS[isl[i]];const r=srng();
  if(r<0.075){deco[i]=1;solid[i]=1;}else if(r<0.14){deco[i]=2;}
}
// keep paths from island centers clear: carve a little plus-shaped path
ISLANDS.forEach(I=>{for(let d=-I.r;d<=I.r;d++){[[I.x+d,I.y+1],[I.x,I.y+d]].forEach(([x,y])=>{if(x<0||y<0||x>=MW||y>=MH)return;const i=y*MW+x;if(deco[i]===1){deco[i]=0;solid[i]=0;}});}});
// boats
ISLANDS.forEach((I,k)=>{(I.boats||[]).forEach(a=>{for(let s=0;s<I.r*2.5;s+=.5){const tx=Math.floor(I.x+Math.cos(a)*s),ty=Math.floor(I.y+Math.sin(a)*s);if(tx<0||ty<0||tx>=MW||ty>=MH)break;const i=ty*MW+tx;if(terr[i]<=1){BOATS.push({x:(tx+.5)*T,y:(ty+.5)*T,face:Math.cos(a)>0?1:-1,home:k});break;}}});});

{const g=mm.getContext('2d'),img=g.createImageData(MW,MH);const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];

// ================= world logic =================
function tileIdx(px,py){const tx=Math.floor(px/T),ty=Math.floor(py/T);if(tx<0||ty<0||tx>=MW||ty>=MH)return -1;return ty*MW+tx;}
function isLandWalk(px,py){const i=tileIdx(px,py);return i>=0&&terr[i]>=2&&!solid[i];}
function isWater(px,py){const i=tileIdx(px,py);return i>=0&&terr[i]<=1;}
const RW=18,RH=12;
function museumBlocked(px,py){const tx=Math.floor(px/T),ty=Math.floor(py/T);if(tx<1||tx>RW-2||ty<2||ty>RH-2)return true;return MUSEUMS[curMuseum].exhibits.some(e=>e.tx===tx&&e.ty===ty);}
function canMove(nx,ny){if(scene==='museum')return !museumBlocked(nx,ny);if(P.mode==='fly')return nx>T&&ny>T&&nx<(MW-1)*T&&ny<(MH-1)*T;if(P.mode==='boat')return isWater(nx,ny);return isLandWalk(nx,ny);}
function hasPet(id){return S.pets.includes(id);}
function nearestBoat(maxD){let b=null,bd=maxD;BOATS.forEach(o=>{if(o===P.boat)return;const d=dist(o.x,o.y,P.x,P.y);if(d<bd){bd=d;b=o;}});return b;}
function findLandNear(){for(const r of [1,1.4,1.9]){for(let a=0;a<16;a++){const an=a/16*Math.PI*2;const x=P.x+Math.cos(an)*r*T,y=P.y+Math.sin(an)*r*T;if(isLandWalk(x,y))return{x,y};}}return null;}

function findAct(){
  let best=null,bd=1e9;const take=(d,o)=>{if(d<bd){bd=d;best=o;}};
  if(scene==='museum'){
    MUSEUMS[curMuseum].exhibits.forEach(e=>{const x=(e.tx+.5)*T,y=(e.ty+.5)*T,d=dist(x,y,P.x,P.y);if(d<52)take(d,{type:'exhibit',o:e,x,y:y-10,label:(e.book?'Read ':'Look at ')+e.n});});
    const dx=(RW/2)*T,dy=(RH-1)*T,d=dist(dx,dy,P.x,P.y);if(d<46)take(d,{type:'exit',x:dx,y:dy-10,label:'Leave the museum'});
    return best;
  }
  if(P.mode==='walk'){
    NPCS.forEach(n=>{const d=dist(n.x,n.y,P.x,P.y);if(d<54)take(d,{type:'npc',o:n,x:n.x,y:n.y-14,label:'Talk to '+n.name});});
    ANIMALS.forEach(a=>{if(hasPet(a.pet))return;const d=dist(a.x,a.y,P.x,P.y);if(d<54)take(d,{type:'animal',o:a,x:a.x,y:a.y-14,label:'Meet '+PETS[a.pet].short});});
    BUILDINGS.forEach(b=>{if(!b.door)return;const d=dist(b.door.x,b.door.y,P.x,P.y);if(d<44)take(d,{type:b.k,o:b,x:b.door.x,y:b.door.y-20,label:b.k==='museum'?'Go into '+MUSEUMS[b.museum].name:'Take a nap at home'});});
    if(S.bossAwake&&BOSS){const d=dist(BOSS.x,BOSS.y,P.x,P.y);if(d<70)take(d-20,{type:'boss',x:BOSS.x,y:BOSS.y-36,label:'Face the Shadow Dragon!'});}
    BOATS.forEach(b=>{const d=dist(b.x,b.y,P.x,P.y);if(d<62)take(d+6,{type:'boat',o:b,x:b.x,y:b.y-26,label:'Get in the boat ⛵'});});
    PLANTS.forEach(p=>{if(!p.ripe)return;const d=dist(p.x,p.y,P.x,P.y);if(d<34)take(d,{type:'plant',o:p,x:p.x,y:p.y-18,label:'Pick '+CROPS[p.type].n});});
  }else if(P.mode==='boat'){
    const l=findLandNear();if(l)best={type:'land',o:l,x:P.x,y:P.y-34,label:'Hop onto land 🏝️'};
  }
  return best;
}

function doAct(a){
  if(!a){if(P.mode==='boat')toast('Sail closer to land to hop off!');return;}
  switch(a.type){
    case 'npc':talkNPC(a.o);break;
    case 'animal':meetAnimal(a.o);break;
    case 'museum':enterMuseum(a.o);break;
    case 'house':S.seen.nap=1;save();say({name:'Home Sweet Home',emoji:'🏠',text:'You and your pets took a cozy nap. Zzz... 😴 Your game is saved!'});break;
    case 'boss':meetBoss();break;
    case 'boat':P.mode='boat';P.boat=a.o;P.x=a.o.x;P.y=a.o.y;SFX.boat();toast('⛵ All aboard! Sail on the water. Press E near land to hop off.');break;
    case 'land':P.mode='walk';P.boat=null;P.x=a.o.x;P.y=a.o.y;resetTrail();toast('🏝️ Land ho!');break;
    case 'plant':pickPlant(a.o);break;
    case 'exhibit':readExhibit(a.o);break;
    case 'exit':exitMuseum();break;
  }
}
function pickPlant(p){if(!p.ripe)return;p.ripe=false;p.t=25;S.inv[p.type]=(S.inv[p.type]||0)+1;SFX.pick();toast(`${CROPS[p.type].e} +1 ${CROPS[p.type].n}!`,1500);hudDirty=true;}

function talkNPC(n){
  const first=!S.talked[n.id];S.talked[n.id]=1;
  const line=n.lines[n.li%n.lines.length];n.li++;
  if(n.fight){
    const lvl=n.fight;say({name:n.name,emoji:n.e,text:line+` (Battle level ${lvl} ⚔️)`,choices:[{label:'⚔️ Battle!',fn:()=>startBattle({name:n.name,e:n.e,lvl})},{label:'Maybe later',fn:()=>{}}]});
  }else say({name:n.name,emoji:n.e,text:line});
  if(first)hudDirty=true;
}
function meetAnimal(a){
  const pd=PETS[a.pet],need=a.need;
  if(!need)return joinPet(a.pet);
  if(need.item){const have=S.inv[need.item]||0;const cr=CROPS[need.item];
    if(have>=need.n){say({name:pd.name,emoji:pd.e,text:`${pd.short} sniffs your backpack... ${cr.e} Can I have ${need.n} ${cr.n.toLowerCase()}${need.n>1?'s':''}?`,choices:[{label:`Give ${need.n} ${cr.e}`,fn:()=>{S.inv[need.item]-=need.n;joinPet(a.pet);}},{label:'Not yet',fn:()=>{}}]});}
    else say({name:pd.name,emoji:pd.e,text:`${pd.short} looks hungry. It wants ${need.n} ${cr.e} ${cr.n.toLowerCase()}${need.n>1?'s':''}. You have ${have}. Find a garden!`});
  }else if(need.wins){
    if(S.wins>=need.wins)joinPet(a.pet);
    else say({name:pd.name,emoji:pd.e,text:`${pd.short} only joins winners! Win ${need.wins} battle${need.wins>1?'s':''} ⚔️ (you have ${S.wins}). Talk to people with ⚔️ to battle.`});
  }
}
function joinPet(id){if(hasPet(id))return;S.pets.push(id);syncPets();const p=pets[pets.length-1];p.x=P.x;p.y=P.y;SFX.unlock();hudDirty=true;save();
  const pd=PETS[id];toast(`🎉 ${pd.name} joined your team!`,3200);
  say({name:pd.name,emoji:pd.e,text:`Yay! ${pd.name} is your new pet! Power: ${pd.power}. ${pd.desc}${id==='cheetah'?' Zoom also makes you walk faster!':''}`});}

function meetBoss(){
  const hp=bossHP();
  say({name:'Shadow Dragon',emoji:'🐉',text:`ROOOAR! Who dares wake me?! (Boss: ${hp} energy${S.bossBonus?`, extra strong because the rivals got here first`:''})`,choices:[{label:'⚔️ Battle the Dragon!',fn:()=>startBattle({name:'Shadow Dragon',e:'🐉',lvl:6,boss:true})},{label:'Not ready yet',fn:()=>{}}]});
}

function enterMuseum(b){curMuseum=b.museum;museumDoor={x:b.door.x,y:b.door.y+4};scene='museum';P.x=(RW/2)*T;P.y=(RH-2.5)*T;P.mode='walk';resetTrail();

function readExhibit(e){
  if(e.book){e.book.forEach((pg,i)=>say({name:e.n,emoji:e.e,text:`📖 Page ${i+1}: ${pg}`,choices:[{label:i<e.book.length-1?'Next page ▶':'Close book'}]}));}
  else say({name:e.n,emoji:e.e,text:e.text});

function toggleFly(){
  if(scene!=='world')return toast("You can't fly indoors! 🏛️");
  if(P.mode!=='fly'){P.boat=null;P.mode='fly';SFX.fly();toast('🕊️ Whee! You are flying! Press F again to land.');return;}
  if(isLandWalk(P.x,P.y)){P.mode='walk';toast('Landed! 👣');resetTrail();return;}
  const b=nearestBoat(80);if(b){P.mode='boat';P.boat=b;P.x=b.x;P.y=b.y;toast('Landed in a boat ⛵');return;}
  if(isWater(P.x,P.y))toast("Can't land in the water! Fly to land or a boat ⛵");else toast("Can't land here. Try a clear spot!");
}

// ================= weather =================
const Wt={type:'sunny',t:40,flash:0,flashT:5,clouds:[]};
for(let i=0;i<6;i++)Wt.clouds.push({x:Math.random(),y:Math.random()*.35,s:rand(.7,1.3),v:rand(.004,.01)});
let WP=[],wpType='';
function pickWeather(){const opts=['sunny','sunny','cloudy','rain','storm','snow','fog','windy'];let n;
  if((Wt.type==='rain'||Wt.type==='storm')&&Math.random()<.6)n='rainbow';else{do n=pick(opts);while(n===Wt.type);}
  Wt.type=n;Wt.t=rand(35,60);if(scene!=='title')toast(`${WEATHER[n].e} The weather is now ${WEATHER[n].n.toLowerCase()}!`);hudDirty=true;}
function effWeather(){if(scene==='museum')return 'inside';const I=ISLANDS[curIsland];if(I&&I.biome==='snow'&&['rain','storm','sunny','cloudy','windy'].includes(Wt.type))return 'snow';return Wt.type;}
function weatherUpdate(dt){
  Wt.t-=dt;if(Wt.t<=0)pickWeather();
  const ew=effWeather();if(ew!==wpType){WP=[];wpType=ew;}
  const want={rain:220,storm:340,snow:160,windy:28}[ew]||0;
  while(WP.length<want)WP.push(newPart(ew,true));
  for(const p of WP){p.x+=p.vx*dt;p.y+=p.vy*dt;if(ew==='snow')p.x+=Math.sin(time*2+p.s*10)*20*dt;if(p.y>VH+20||p.x<-60||p.x>VW+60)Object.assign(p,newPart(ew,false));}
  if(ew==='storm'){Wt.flashT-=dt;if(Wt.flashT<=0){Wt.flash=1;Wt.flashT=rand(4,9);setTimeout(()=>SFX.thunder(),250);}}
  Wt.flash=Math.max(0,Wt.flash-dt*2.5);
  Wt.clouds.forEach(c=>{c.x+=c.v*dt*(ew==='windy'?4:1);if(c.x>1.2)c.x=-.2;});
}
function newPart(ew,anyY){const p={x:rand(-40,VW+40),y:anyY?rand(-20,VH):rand(-60,-10),s:Math.random()};
  if(ew==='rain'||ew==='storm'){p.vx=ew==='storm'?-180:-60;p.vy=rand(650,850);}
  else if(ew==='snow'){p.vx=rand(-15,15);p.vy=rand(40,90);p.r=rand(1.5,4);}
  else if(ew==='windy'){p.x=anyY?rand(0,VW):-30;p.y=rand(0,VH);p.vx=rand(180,320);p.vy=rand(-20,30);}
  return p;}
function drawWeather(){
  const ew=effWeather();if(ew==='inside')return;
  ctx.setTransform(DPR,0,0,DPR,0,0);RES=DPR;
  const shade={cloudy:.16,rain:.26,storm:.4,snow:.08,fog:0,windy:.05}[ew]||0;
  if(shade){ctx.fillStyle=`rgba(40,50,80,${shade})`;ctx.fillRect(0,0,VW,VH);}
  if(ew==='sunny'||ew==='rainbow'){ctx.fillStyle='rgba(255,230,140,.06)';ctx.fillRect(0,0,VW,VH);}
  if(['cloudy','rain','storm','windy','snow'].includes(ew)){Wt.clouds.forEach(c=>drawEmoji('☁️',c.x*VW,c.y*VH*0.6+30,90*c.s,false,ew==='storm'?.95:.8));}
  if(ew==='rain'||ew==='storm'){ctx.strokeStyle='rgba(200,225,255,.55)';ctx.lineWidth=1.5;ctx.beginPath();for(const p of WP){ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+p.vx*.025,p.y+p.vy*.025);}ctx.stroke();}
  if(ew==='snow'){ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();for(const p of WP){ctx.moveTo(p.x+p.r,p.y);ctx.arc(p.x,p.y,p.r,0,6.283);}ctx.fill();}
  if(ew==='windy'){for(const p of WP)drawEmoji('🍃',p.x,p.y,16,false,.9);}
  if(ew==='fog'){const g=ctx.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.12,VW/2,VH/2,Math.max(VW,VH)*.6);g.addColorStop(0,'rgba(235,240,245,0)');g.addColorStop(1,'rgba(235,240,245,.92)');ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);}
  if(ew==='rainbow'){const cols=['#ff5e57','#ff9f43','#feca57','#2ecc71','#48dbfb','#5f27cd','#a55eea'];const R=Math.max(VW,VH)*.75;ctx.lineWidth=Math.max(8,VW/90);cols.forEach((c,i)=>{ctx.strokeStyle=c;ctx.globalAlpha=.28;ctx.beginPath();ctx.arc(VW*.5,VH*1.05,R-i*ctx.lineWidth,Math.PI,0);ctx.stroke();});ctx.globalAlpha=1;}
  if(curIsland>=0&&ISLANDS[curIsland].biome==='volcano'){ctx.fillStyle='rgba(120,30,20,.12)';ctx.fillRect(0,0,VW,VH);ctx.fillStyle='rgba(90,80,80,.6)';for(let i=0;i<40;i++){const x=(hash(i,7)%1000/1000*VW+time*20*(1+i%3))%VW,y=(hash(i,3)%1000/1000*VH+time*35*(1+i%2))%VH;ctx.fillRect(x,y,2,2);}}
  if(Wt.flash>0){ctx.fillStyle=`rgba(255,255,255,${Wt.flash*.7})`;ctx.fillRect(0,0,VW,VH);}
}

const keys={};
const stick={dx:0,dy:0,id:null};

// tap / hold on the map to walk there; tap a person, animal, boat or door to go to it and use it
let dest=null,CAM={x:0,y:0,z:1};
function screenToWorld(cx,cy){return{x:CAM.x+cx/CAM.z,y:CAM.y+cy/CAM.z};}
function tappedThing(w){
  const near=(x,y,r)=>dist(x,y,w.x,w.y)<r;
  if(scene==='museum'){for(const e of MUSEUMS[curMuseum].exhibits)if(near((e.tx+.5)*T,(e.ty+.5)*T-8,30))return{o:e,x:(e.tx+.5)*T,y:(e.ty+.5)*T};
    if(near(RW/2*T,(RH-1)*T,36))return{type:'exit',x:RW/2*T,y:(RH-1.5)*T};return null;}
  if(P.mode!=='walk')return null;
  for(const n of NPCS)if(near(n.x,n.y-6,30))return{o:n,x:n.x,y:n.y};
  for(const a of ANIMALS)if(!hasPet(a.pet)&&near(a.x,a.y-6,30))return{o:a,x:a.x,y:a.y};
  for(const b of BUILDINGS)if(b.door&&near(b.x,b.y-14,52))return{o:b,x:b.door.x,y:b.door.y};
  if(S.bossAwake&&BOSS&&near(BOSS.x,BOSS.y-20,44))return{type:'boss',x:BOSS.x,y:BOSS.y};
  for(const b of BOATS)if(b!==P.boat&&near(b.x,b.y-6,32))return{o:b,x:b.x,y:b.y};
  for(const p of PLANTS)if(p.ripe&&near(p.x,p.y,20))return{o:p,x:p.x,y:p.y};
  return null;
}
const sameAct=(th,a)=>a&&th&&((th.o&&a.o===th.o)||(th.type&&a.type===th.type));
cv.addEventListener('pointerdown',e=>{
  unlockAudio();
  if(scene!=='world'&&scene!=='museum')return;
  if(dlg){if(!dlg.choices||dlg.choices.length===1)chooseDlg(0);return;}
  if(overlayOpen())return;
  const w=screenToWorld(e.clientX,e.clientY);
  if(nearAct&&Math.abs(w.x-nearAct.x)<100&&w.y>nearAct.y-40&&w.y<nearAct.y-4){const a=nearAct;dest=null;doAct(a);return;}
  const th=tappedThing(w);
  if(th&&sameAct(th,nearAct)){const a=nearAct;dest=null;doAct(a);return;}
  dest={x:th?th.x:w.x,y:th?th.y:w.y,th,hold:!th,id:e.pointerId,stuck:0};
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{if(dest&&dest.hold&&dest.id===e.pointerId){const w=screenToWorld(e.clientX,e.clientY);dest.x=w.x;dest.y=w.y;}});
const relDest=e=>{if(dest&&dest.id===e.pointerId)dest.hold=false;};
cv.addEventListener('pointerup',relDest);cv.addEventListener('pointercancel',relDest);
function unlockAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}

function isTouch(){return ('ontouchstart' in window)||navigator.maxTouchPoints>0;}

const stickEl=$('stick'),knob=$('knob');
stickEl.addEventListener('pointerdown',e=>{stick.id=e.pointerId;stickEl.setPointerCapture(e.pointerId);moveStick(e);});

const endStick=e=>{if(e.pointerId!==stick.id)return;stick.id=null;stick.dx=stick.dy=0;knob.style.transform='';};

function moveStick(e){unlockAudio();const r=stickEl.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const m=Math.hypot(dx,dy),max=r.width*0.36;if(m>max){dx=dx/m*max;dy=dy/m*max;}stick.dx=dx/max;stick.dy=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`;}

function openBag(){
  let h='<h2>🎒 Backpack</h2>';
  h+=`<h3>⭐ Boss Race</h3><div>You: <b>${S.race.you}/5</b> wins &nbsp; | &nbsp; Rival Team Thunder: <b>${S.race.rival}/5</b>. ${S.bossAwake?'🐉 <b>The Shadow Dragon is awake on Volcano Island!</b>':'Win 5 battles to wake the Shadow Dragon!'}</div>`;
  h+=`<div style="margin-top:4px">Battles won: <b>${S.wins}</b> · lost: <b>${S.losses}</b> · Max energy: <b>${S.maxE}</b>${S.bossBeaten?` · Dragon beaten: <b>${S.bossBeaten}×</b> 🏆`:''}</div>`;
  h+='<h3>🐾 Your Pets</h3>';
  PET_ORDER.forEach(id=>{const p=PETS[id];if(hasPet(id))h+=`<div class="petCard"><div class="pe">${p.e}${p.badge||''}</div><div><b>${p.name}</b><br>⚡ <b>${p.power}</b>: ${p.desc}<br><i>${p.world}</i></div></div>`;
    else h+=`<div class="petCard locked"><div class="pe">❓</div><div><b>Locked pet</b><br>${PET_HINT[id]}</div></div>`;});
  h+='<h3>🧺 Snacks</h3><div class="items">';const items=Object.keys(CROPS).filter(k=>S.inv[k]>0);
  h+=items.length?items.map(k=>`<span>${CROPS[k].e} ${S.inv[k]} <small>(+${CROPS[k].heal} energy)</small></span>`).join(''):'<i>Empty! Walk over ripe veggies in a garden to pick them.</i>';

// ================= update =================
let time=0,saveT=0;
function update(dt){
  if(scene==='world'||scene==='museum'){
    let ax=0,ay=0;
    if(!dlg&&!overlayOpen()){
      if(keys['arrowleft']||keys['a'])ax-=1;if(keys['arrowright']||keys['d'])ax+=1;if(keys['arrowup']||keys['w'])ay-=1;if(keys['arrowdown']||keys['s'])ay+=1;
      ax+=stick.dx;ay+=stick.dy;
      if(Math.hypot(ax,ay)>0.1)dest=null;
      else if(dest){const dx=dest.x-P.x,dy=dest.y-P.y,d=Math.hypot(dx,dy);if(d<5){if(!dest.hold)dest=null;}else{ax=dx/d;ay=dy/d;if(d<24){ax*=Math.max(.3,d/24);ay*=Math.max(.3,d/24);}}}}
    const m=Math.hypot(ax,ay);if(m>1){ax/=m;ay/=m;}
    const ox=P.x,oy=P.y;
    const sp=P.mode==='fly'?280:P.mode==='boat'?230:(hasPet('cheetah')?190:150);
    P.moving=m>0.1;
    if(P.moving){const mx=ax*sp*dt,my=ay*sp*dt;
      if(canMove(P.x+mx,P.y))P.x+=mx;if(canMove(P.x,P.y+my))P.y+=my;
      if(Math.abs(ax)>0.2)P.face=ax>0?1:-1;P.step+=dt*10;}
    if(dest&&P.moving){if(dist(ox,oy,P.x,P.y)<sp*dt*.15){dest.stuck+=dt;if(dest.stuck>.35&&!dest.hold)dest=null;}else dest.stuck=0;}
    if(P.boat){P.boat.x=P.x;P.boat.y=P.y;P.boat.face=P.face;}
    P.alt+=((P.mode==='fly'?1:0)-P.alt)*Math.min(1,dt*6);
    // trail
    const L=P.trail[0];if(!L||dist(L.x,L.y,P.x,P.y)>3){P.trail.unshift({x:P.x,y:P.y});if(P.trail.length>160)P.trail.pop();}
    pets.forEach((p,i)=>{let tx,ty;
      if(P.mode==='boat'){const offs=[[-14,-2],[14,-2],[-6,8],[8,8],[-20,6],[20,6],[0,-10],[-12,12],[12,12]];const o=offs[i%offs.length];tx=P.x+o[0]*P.face;ty=P.y+o[1]-2;}
      else{const tp=P.trail[Math.min(P.trail.length-1,(i+1)*9)]||P;tx=tp.x;ty=tp.y;}
      const k=1-Math.exp(-(P.mode==='boat'?14:8)*dt);const ox=p.x;p.x+=(tx-p.x)*k;p.y+=(ty-p.y)*k;if(Math.abs(p.x-ox)>0.3)p.face=p.x>ox?1:-1;p.moving=Math.abs(p.x-ox)+Math.abs(ty-p.y)>0.5;
      if(id_isUnicorn(p)&&p.moving&&Math.random()<.3)sparkles.push({x:p.x+rand(-6,6),y:p.y+rand(-4,4),t:0.8,c:pick(['#ff6fa8','#ffd93d','#6be3ff','#b28dff'])});});
    // auto-pick
    if(scene==='world'&&P.mode==='walk')PLANTS.forEach(p=>{if(p.ripe&&dist(p.x,p.y,P.x,P.y)<20)pickPlant(p);});
    nearAct=(dlg||overlayOpen())?null:findAct();
    if(dest&&dest.th&&sameAct(dest.th,nearAct)){const a=nearAct;dest=null;doAct(a);}
    updateTouchBtns();
    // island
    if(scene==='world'){const i=tileIdx(P.x,P.y);curIsland=i>=0?isl[i]:-1;if(curIsland>=0&&terr[i]<2&&P.mode!=='walk'){/* in shallows still counts */}
      if(curIsland!==lastIsland){if(curIsland>=0&&lastIsland!==-2){toast(`🏝️ ${ISLANDS[curIsland].name}`);}lastIsland=curIsland;hudDirty=true;}}
  }else dest=null;
  // plants regrow
  const grow=(Wt.type==='rain'||Wt.type==='storm')?2:1;
  PLANTS.forEach(p=>{if(!p.ripe){p.t-=dt*grow;if(p.t<=0)p.ripe=true;}});
  CRITTERS.forEach(c=>{c.ph+=dt*(c.air?1.2:0.4);c.x=c.hx+Math.cos(c.ph)*c.r*(c.air?.8:1);c.y=c.hy+Math.sin(c.ph*1.3)*c.r*.5;});
  sparkles.forEach(s=>s.t-=dt);sparkles=sparkles.filter(s=>s.t>0);
  if(scene!=='title')weatherUpdate(dt);
  if(scene==='battle'&&B)battleUpdate(dt);
  hudT-=dt;if(scene!=='title'&&(hudDirty||hudT<=0)){hudDirty=false;hudT=.5;updateHUD();}
  saveT+=dt;if(saveT>8&&(scene==='world')){saveT=0;if(P.mode==='walk')save();}
}

  ctx.setTransform(DPR*z,0,0,DPR*z,-camX*DPR*z,-camY*DPR*z);RES=DPR*z;CAM={x:camX,y:camY,z};

  // decorations
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const i=y*MW+x,d=deco[i];if(!d)continue;const bi=BIOME[ISLANDS[isl[i]].biome];const cx=x*T+16,cy=y*T+16;
    if(d===1){if(bi.tree==='rock'){ctx.fillStyle='#3d3232';ctx.beginPath();ctx.ellipse(cx,cy+4,13,10,0,0,6.3);ctx.fill();ctx.fillStyle='#5a4a4a';ctx.beginPath();ctx.ellipse(cx-3,cy,8,6,0,0,6.3);ctx.fill();}
      else{ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(cx,cy+12,12,4,0,0,6.3);ctx.fill();drawEmoji(bi.tree,cx,cy-4,34);}}
    else if(d===2)drawEmoji(bi.flowers[dvar[i]%3],cx+(dvar[i]%7-3),cy+(dvar[i]%5-2),12);}
  drawDest();
  // entities
  const ents=[];
  BUILDINGS.forEach(b=>ents.push({y:b.y+T*0.6,f:()=>drawBuilding(b)}));

  CRITTERS.forEach(c=>{if(c.x<camX-50||c.x>camX+VW/z+50||c.y<camY-50||c.y>camY+VH/z+50)return;if(!c.air&&!isWater(c.x,c.y))return;ents.push({y:c.air?c.y+40:c.y-40,f:()=>{if(c.air)drawEmoji(c.e,c.x,c.y-20+Math.sin(time*8+c.ph)*3,14,Math.cos(c.ph)<0);else{const j=Math.max(0,Math.sin(time*1.5+c.ph*3));drawEmoji(c.e,c.x,c.y-j*10,c.e==='🐳'?30:18,Math.sin(c.ph)>0,.85);}}});});

function drawMuseum(){

  let camX=rw*z<VW?(rw-VW/z)/2:clamp(P.x-VW/2/z,0,rw-VW/z),camY=rh*z<VH?(rh-VH/z)/2:clamp(P.y-VH/2/z,0,rh-VH/z);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#2a1d36';ctx.fillRect(0,0,VW,VH);
  ctx.setTransform(DPR*z,0,0,DPR*z,-camX*DPR*z,-camY*DPR*z);RES=DPR*z;CAM={x:camX,y:camY,z};
  for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){let c;if(y<2||x===0||x===RW-1||y===RH-1)c=(y===1)?M.wall2:M.wall;else c=((x+y)&1)?M.floor1:M.floor2;ctx.fillStyle=c;ctx.fillRect(x*T,y*T,T+.5,T+.5);}
  // carpet
  ctx.fillStyle='rgba(200,40,80,.35)';ctx.fillRect((RW/2-1)*T,2*T,2*T,(RH-3)*T);
  // windows & title on wall
  for(let x=2;x<RW-2;x+=4){ctx.fillStyle='#bfe8ff';roundRect(x*T+4,8,T*1.4,T*1.1,8);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();}
  label(M.name,rw/2,T*1.55,16,'#fff4c2');
  // door
  ctx.fillStyle='#7a4a24';roundRect((RW/2-1)*T+4,(RH-1)*T,2*T-8,T,6);ctx.fill();label('EXIT',rw/2,(RH-.5)*T,11,'#ffe27a');
  drawDest();
  const ents=[];
  M.exhibits.forEach(e=>ents.push({y:(e.ty+.5)*T,f:()=>{const x=(e.tx+.5)*T,y=(e.ty+.5)*T;ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(x,y+12,15,5,0,0,6.3);ctx.fill();
    ctx.fillStyle=e.book?'#8b5a35':'#e9e1f5';roundRect(x-14,y-2,28,16,4);ctx.fill();ctx.fillStyle=e.book?'#a8703f':'#fff';roundRect(x-14,y-4,28,6,3);ctx.fill();
    drawEmoji(e.e,x,y-14+Math.sin(time*2+e.tx)*1.5,e.book?20:28);label(e.n,x,y+22,8,'#fff');}}));
  pets.forEach((p,i)=>ents.push({y:p.y,f:()=>drawPet(p,i)}));ents.push({y:P.y,f:drawPlayer});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
  drawPrompt();
}

const POWERS={

  leopard:async()=>{const L=layout();await shoot('🐾',petFrom('leopard'),L.EP,.45,44);const c=Math.random()<.3;hitEnemy(ri(25,32)*(c?2:1),c);},
  fish:async()=>{petFrom('fish');await wait(300);B.shield=2;const L=layout();fxBurst(L.PP.x,L.PP.y,['#9fe3ff','#ffffff','#5fd3ea'],24);SFX.heal();bmsg('Bubble Shield! It will block the next 2 attacks! 🫧');},
  penguin:async()=>{const L=layout();await shoot('❄️',petFrom('penguin'),L.EP,.45);hitEnemy(ri(18,24));B.stun=1;bmsg('Ice Slide! The other side is frozen for a turn! 🧊');},
  bunny:async()=>{petFrom('bunny');await wait(300);healMe(45);},
  dragon:async()=>{const L=layout();await shoot('🌟',petFrom('dragon'),L.EP,.55,60);hitEnemy(ri(55,70));fxBurst(L.EP.x,L.EP.y,['#ffd93d','#ff9f43','#fff'],30);},
};
async function playerAction(kind,arg){
  if(!B||B.busy||B.over)return;B.busy=true;B.menu=null;renderBtns();
  const L=layout();
  if(kind==='splash'){bmsg(`${S.name} used Splash Attack!`);await shoot('💦',L.PP,L.EP,.45);hitEnemy(ri(10,16));}
  else if(kind==='pet'){const p=PETS[arg];bmsg(`${p.short} used ${p.power}!`);await POWERS[arg]();B.cd[arg]=3;}
  else if(kind==='snack'){S.inv[arg]--;bmsg(`You ate a ${CROPS[arg].n.toLowerCase()}. Yum! ${CROPS[arg].e}`);B.fx.push({k:'proj',e:CROPS[arg].e,x0:L.PP.x,y0:L.PP.y-80,x1:L.PP.x,y1:L.PP.y,age:0,life:.4,size:36,done:()=>{}});await wait(400);healMe(CROPS[arg].heal);}
  await wait(650);
  if(B.ehp<=0)return win();
  await enemyTurn();
}
async function enemyTurn(){
  B.turn++;const L=layout();
  if(B.stun>0){B.stun=0;bmsg(`${B.ename} is too surprised to move!`);await wait(1000);return endRound();}
  let mv;if(B.opp.boss&&B.turn%3===0)mv={n:'Shadow Storm',e:'🌪️',dmg:ri(26,32)};else{const m=pick(B.opp.boss?BOSS_MOVES:MOVES);mv={...m,dmg:ri(B.atk[0],B.atk[1])};}
  bmsg(`${B.ename} used ${mv.n}!`);await wait(450);await shoot(mv.e,L.EP,L.PP,.5,B.opp.boss?54:40);
  if(B.shield>0){B.shield--;fxText('Blocked!',L.PP.x,L.PP.y-L.s*.12,'#4fc3f7');bmsg('The Bubble Shield blocked it! 🫧');}
  else if(B.dodge){B.dodge=false;fxText('Dodged!',L.PP.x,L.PP.y-L.s*.12,'#b28dff');bmsg('You dodged it! Lucky purr! 🍀');}
  else{B.hp=Math.max(0,B.hp-mv.dmg);B.pShake=.4;fxText('-'+mv.dmg,L.PP.x,L.PP.y-L.s*.12,'#ff5e57');SFX.hit();}
  await wait(750);
  if(B.hp<=0){if(!B.rescued){await rescue();if(B.ehp<=0)return win();}else return lose();}
  endRound();
}
async function rescue(){
  B.rescued=true;const L=layout();
  bmsg('Oh no, you fainted! 😵 ...But wait! Your animals are rushing in to help!');await wait(1500);
  for(let k=0;k<10;k++)B.fx.push({k:'proj',e:'💖',x0:petPos(k%S.pets.length,L).x,y0:petPos(k%S.pets.length,L).y,x1:L.PP.x+rand(-30,30),y1:L.PP.y+rand(-30,10),age:-k*.06,life:.6,size:26,done:()=>{}});
  await wait(800);B.hp=0;healMe(Math.round(B.max*.6));bmsg('Your pets gave you a big hug! You got back up! 💖');await wait(1100);
  bmsg('TEAM POWER! All your animals attack together!');
  for(const id of S.pets){if(B.ehp<=0)break;const from=petFrom(id);await shoot(PETS[id].e,from,L.EP,.3,40);hitEnemy(ri(12,18));}
  B.cd={};B.shield=Math.max(B.shield,1);await wait(700);
  if(B.ehp>0)bmsg('Your animals have your back! All powers are ready, plus a bubble shield!');
  await wait(900);
}
function endRound(){if(!B||B.over)return;for(const k in B.cd)if(B.cd[k]>0)B.cd[k]--;B.busy=false;bmsg('Your turn! What will you do?');renderBtns();}
function win(){

function endBattle(){const notes=B.notes||[];B=null;scene='world';$('battleUI').classList.add('hidden');$('hud').classList.remove('hidden');hudDirty=true;notes.forEach(n=>say(n));}
function battleUpdate(dt){B.eShake=Math.max(0,B.eShake-dt);B.pShake=Math.max(0,B.pShake-dt);for(const k in B.hop)B.hop[k]=Math.max(0,B.hop[k]-dt);
  B.fx.forEach(f=>{f.age+=dt;if(f.k==='dot'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=300*dt;}if(f.k==='proj'&&f.age>=f.life&&!f.fired){f.fired=true;f.done&&f.done();}});
  B.fx=B.fx.filter(f=>f.age<f.life||(f.k==='proj'&&!f.fired));}

  ctx.setTransform(DPR,0,0,DPR,0,0);RES=DPR;const L=layout(),bi=BIOME[B.biome],boss=B.opp.boss;
  const g=ctx.createLinearGradient(0,0,0,L.bh);g.addColorStop(0,boss?'#3b1747':bi.sky[0]);g.addColorStop(1,boss?'#c2563a':bi.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle=boss?'#4d3535':bi.ground;ctx.beginPath();ctx.ellipse(VW/2,L.bh*1.05,VW*.85,L.bh*.5,0,Math.PI,0);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.14)';ctx.beginPath();ctx.ellipse(L.EP.x,L.EP.y+L.s*.1,L.s*.17,L.s*.045,0,0,6.3);ctx.fill();ctx.beginPath();ctx.ellipse(L.PP.x,L.PP.y+L.s*.08,L.s*.22,L.s*.05,0,0,6.3);ctx.fill();
  // enemy
  const es=boss?L.s*.3:L.s*.2;const ex=L.EP.x+Math.sin(B.eShake*60)*B.eShake*20,ey=L.EP.y+Math.sin(time*2)*4;
  if(boss){const gg=ctx.createRadialGradient(ex,ey,5,ex,ey,es);gg.addColorStop(0,'rgba(80,0,110,.5)');gg.addColorStop(1,'rgba(80,0,110,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(ex,ey,es,0,6.3);ctx.fill();}
  if(B.ehp>0||!B.over)drawEmoji(B.over&&B.result==='win'&&boss?'🐲':B.ee,ex,ey,es,false,B.ehp<=0&&!boss?.4:1);else drawEmoji(boss?'🐲':B.ee,ex,ey,boss?es*.6:es,false,boss?1:.4);

    if(pd.bubble){ctx.fillStyle='rgba(160,230,255,.35)';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,y,sz*.62,0,6.3);ctx.fill();ctx.stroke();}
    drawEmoji(pd.e,p.x,y,sz,true,(B.cd[id]||0)>0?.55:1);if(pd.badge)drawEmoji(pd.badge,p.x+sz*.4,y-sz*.4,sz*.4);});
  const px=L.PP.x+Math.sin(B.pShake*60)*B.pShake*20,py=L.PP.y+Math.sin(time*2.4)*3;

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(scene==='title'){drawTitleBg();return;}
  if(scene==='world'){drawWorld();drawWeather();}
  else if(scene==='museum'){drawMuseum();}
  else if(scene==='battle'&&B){drawBattle();}
  if(scene!=='battle')drawMini();
}

requestAnimationFrame(frame);
