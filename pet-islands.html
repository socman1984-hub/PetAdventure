<style>
/* Layout: full-screen canvas game; floating rounded HUD cards; bottom dialog box. Single bright cartoon look in both themes. */
:root{
  --sea:#1f7fc4; --panel:#fffaf0; --panel2:#ffe9c7; --ink:#3a2a4d; --accent:#ff5fa2; --accent2:#7b5cff;
  --good:#2fbf71; --bad:#ff5e57; --gold:#ffc53d; --muted:#8a7a99;
  --font:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--sea);color:var(--ink);font-family:var(--font);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
input{user-select:text;-webkit-user-select:text;touch-action:manipulation}
#game{position:fixed;inset:0;display:block}
.hidden{display:none!important}
.card{background:color-mix(in srgb,var(--panel) 92%,transparent);border-radius:16px;box-shadow:0 4px 0 rgba(58,42,77,.25),0 8px 20px rgba(0,0,0,.15);padding:6px 12px;border:3px solid #fff}
button{font-family:var(--font);cursor:pointer;border:none;color:var(--ink);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}

#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud > *{pointer-events:auto}
#topLeft{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));max-width:44vw}
#who{font-weight:800;font-size:18px;line-height:1.1}
#petsRow{font-size:22px;letter-spacing:2px;line-height:1.2}
#race{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);text-align:center;font-weight:700;font-size:14px;white-space:nowrap}
#race .bar{display:flex;gap:3px;justify-content:center;font-size:15px}
#topRight{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mini{width:150px;height:145px;border-radius:12px;border:3px solid #fff;box-shadow:0 4px 0 rgba(58,42,77,.25);background:#1f7fc4;cursor:pointer}
#weatherTag{font-weight:700;font-size:14px}
#invBar{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:15px;font-weight:700;margin-top:2px;padding-top:3px;border-top:2px dashed #ecdcc4}
#invBar:empty{display:none}
#btns{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.rbtn{width:48px;height:48px;border-radius:50%;font-size:24px;background:var(--panel);box-shadow:0 4px 0 rgba(58,42,77,.3);border:3px solid #fff}
.rbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(58,42,77,.3)}
#touch{display:none}
body.touch #touch{display:block}
#stick{position:fixed;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.7);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:calc(50% - 25px);top:calc(50% - 25px);pointer-events:none;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.tbtn{position:fixed;width:72px;height:72px;border-radius:50%;font-size:22px;font-weight:800;line-height:1;background:var(--gold);border:4px solid #fff;box-shadow:0 4px 0 rgba(58,42,77,.35);pointer-events:auto}
.tbtn small{font-size:12px}
#tE{right:max(20px,env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px))}
#tF{right:max(104px,calc(env(safe-area-inset-right,0px) + 84px));bottom:calc(80px + env(safe-area-inset-bottom,0px));background:#9fe3ff}

#toasts{position:fixed;top:calc(108px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;font-weight:700;padding:6px 16px;border-radius:999px;font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.25);text-align:center;max-width:90vw}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateY(-10px);visibility:hidden}}

#dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(660px,calc(100vw - 24px));z-index:20;background:var(--panel);border:4px solid #fff;border-radius:22px;box-shadow:0 6px 0 rgba(58,42,77,.3),0 12px 30px rgba(0,0,0,.25);padding:12px 18px 14px}
#dhead{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--accent2)}
#demoji{font-size:34px;line-height:1}
#dtext{font-size:19px;line-height:1.35;margin:6px 0 10px;font-weight:500;min-height:2.6em}
#dchoices{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.choice{background:var(--accent);color:#fff;font-weight:800;font-size:17px;padding:6px 16px;border-radius:999px;box-shadow:0 4px 0 #c93c7c}
.choice.alt{background:var(--panel2);color:var(--ink);box-shadow:0 4px 0 #d9b98a}
.choice:active{transform:translateY(2px);box-shadow:0 2px 0 #c93c7c}
.choice .k{opacity:.7;font-size:13px;margin-right:4px}

#battleUI{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);border-top:4px solid #fff;box-shadow:0 -6px 20px rgba(0,0,0,.2);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#bmsg{font-weight:700;font-size:18px;min-height:28px;margin-bottom:8px;text-align:center}
#bbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.bbtn{background:#fff;border:3px solid var(--accent2);border-radius:14px;padding:6px 12px;font-size:16px;font-weight:700;box-shadow:0 4px 0 var(--accent2);min-width:120px}
.bbtn .p{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.bbtn:disabled{opacity:.45;cursor:default}
.bbtn.main{border-color:var(--accent);box-shadow:0 4px 0 var(--accent)}
.bbtn.snack{border-color:var(--good);box-shadow:0 4px 0 var(--good)}
.bbtn:not(:disabled):active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent2)}

#overlay{position:fixed;inset:0;z-index:30;background:rgba(30,20,50,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#ovBox{touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--panel);border:4px solid #fff;border-radius:22px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:16px 20px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#ovBox h2{margin:0 0 6px;font-size:26px;color:var(--accent2)}
#ovBox h3{margin:12px 0 4px;font-size:19px}
.petCard{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:6px 10px;margin:6px 0}
.petCard .pe{font-size:34px;width:46px;text-align:center}
.petCard.locked{opacity:.6}
.petCard b{font-size:17px}
.petCard div{font-size:14px;line-height:1.25}
.items{display:flex;flex-wrap:wrap;gap:8px;font-size:18px;font-weight:700}
.items span{background:#fff;border-radius:12px;padding:2px 10px}
.closeBtn{float:right;background:var(--accent);color:#fff;font-weight:800;border-radius:999px;padding:4px 14px;font-size:16px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:16px}
.keys kbd{background:#fff;border-radius:8px;padding:0 8px;font-family:var(--font);font-weight:800;border:2px solid #d9c8ef;white-space:nowrap}
#mapCanvas{width:100%;height:auto;border-radius:14px;border:3px solid #fff;display:block}

#title{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 50% 30%,#7fd8ff,#1f7fc4 70%)}
#tbox{background:var(--panel);border:5px solid #fff;border-radius:28px;padding:20px 24px;max-width:560px;width:100%;text-align:center;box-shadow:0 10px 0 rgba(58,42,77,.3),0 20px 60px rgba(0,0,0,.3)}
#tbox h1{margin:0;font-size:clamp(34px,8vw,54px);line-height:1;color:var(--accent);text-shadow:3px 3px 0 #fff,5px 5px 0 rgba(123,92,255,.35)}
#tbox .sub{font-size:18px;margin:6px 0 12px}
#tbox .parade{font-size:34px;letter-spacing:4px;margin-bottom:8px}
#chars{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.charBtn{font-size:36px;width:62px;height:62px;border-radius:16px;background:#fff;border:3px solid #e6dcf5}
.charBtn.sel{border-color:var(--accent);background:#ffe6f2;transform:scale(1.08)}
#nameIn{font-family:var(--font);font-size:20px;font-weight:700;padding:6px 12px;border-radius:12px;border:3px solid #e6dcf5;text-align:center;width:220px;max-width:100%;color:var(--ink);background:#fff}
.bigBtn{background:var(--accent);color:#fff;font-weight:800;font-size:22px;padding:8px 26px;border-radius:999px;box-shadow:0 5px 0 #c93c7c;margin:12px 6px 0}
.bigBtn.alt{background:var(--accent2);box-shadow:0 5px 0 #5638d6}
@media (max-width:640px){
  #mini{width:100px;height:97px}
  #race{top:auto;bottom:calc(66px + env(safe-area-inset-bottom,0px));font-size:12px}
  body.touch #race{bottom:auto;top:calc(146px + env(safe-area-inset-top,0px));left:auto;right:max(10px,env(safe-area-inset-right,0px));transform:none}
  #who{font-size:15px}#petsRow{font-size:18px}
  #dtext{font-size:17px}
}
.tbtn.ready{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 4px 0 rgba(58,42,77,.35),0 0 0 0 rgba(255,197,61,.8)}to{box-shadow:0 4px 0 rgba(58,42,77,.35),0 0 0 10px rgba(255,197,61,0)}}
/* tablets: bigger thumbs-friendly controls */
@media (min-width:641px){
  body.touch #stick{width:170px;height:170px;bottom:calc(30px + env(safe-area-inset-bottom,0px))}
  body.touch #knob{width:64px;height:64px;left:calc(50% - 32px);top:calc(50% - 32px)}
  body.touch .tbtn{width:92px;height:92px;font-size:30px}
  body.touch .tbtn small{font-size:15px}
  body.touch #tE{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  body.touch #tF{right:max(126px,calc(env(safe-area-inset-right,0px) + 106px));bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  body.touch .rbtn{width:56px;height:56px;font-size:28px}
  body.touch .bbtn{font-size:19px;padding:10px 16px;min-width:150px}
  body.touch .choice{font-size:20px;padding:10px 22px}
}
@media (prefers-reduced-motion:reduce){.tbtn.ready{animation:none}}
</style>

<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="topLeft" class="card"><div id="who"></div><div id="petsRow"></div><div id="invBar" title="Your snacks"></div></div>
  <div id="race" class="card"></div>
  <div id="topRight"><canvas id="mini" width="150" height="145" title="Open map"></canvas><div id="weatherTag" class="card"></div></div>
  <div id="btns">
    <button class="rbtn" id="bBag" title="Backpack (I)">🎒</button>
    <button class="rbtn" id="bMap" title="Map (M)">🗺️</button>
    <button class="rbtn" id="bHelp" title="Help (H)">❓</button>
    <button class="rbtn" id="bSnd" title="Sound on/off">🔊</button>
  </div>
  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <button class="tbtn" id="tE">E<br><small>Use</small></button>
    <button class="tbtn" id="tF">🕊️<br><small>Fly</small></button>
  </div>
</div>
<div id="toasts"></div>
<div id="dialog" class="hidden"><div id="dhead"><span id="demoji"></span><span id="dname"></span></div><div id="dtext"></div><div id="dchoices"></div></div>
<div id="battleUI" class="hidden"><div id="bmsg"></div><div id="bbtns"></div></div>
<div id="overlay" class="hidden"><div id="ovBox"></div></div>

<div id="title">
  <div id="tbox">
    <div class="parade">🐶🐱🦄🐆🐠</div>
    <h1>Pet Islands</h1>
    <div class="sub">Sail, fly, dive, make animal friends, and beat three giant bosses!</div>
    <div><b>Pick your hero:</b></div>
    <div id="chars"></div>
    <div><input id="nameIn" maxlength="14" value="Addison" aria-label="Your name"></div>
    <div><button class="bigBtn" id="startBtn">▶ New Game</button><button class="bigBtn alt hidden" id="contBtn">Continue</button></div>
  </div>
</div>

<script>
(()=>{
'use strict';
// ================= helpers =================
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const srng=mulberry32(20261115);
const hash=(x,y)=>{let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return ((h^(h>>>16))>>>0)};

// ================= canvas & sprites =================
const cv=$('game'),ctx=cv.getContext('2d');
let VW=0,VH=0,DPR=1,ZOOM=1,RES=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);cv.style.width=VW+'px';cv.style.height=VH+'px';ZOOM=clamp(Math.min(VW/1000,VH/700)*1.3,0.7,1.6);}
addEventListener('resize',resize);resize();
const EMOJI_FONT='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
const spriteCache=new Map();
function sprite(e,px){const k=e+'|'+px;let c=spriteCache.get(k);if(c)return c;c=document.createElement('canvas');const s=Math.ceil(px*1.4);c.width=c.height=s;const g=c.getContext('2d');g.font=`${px}px ${EMOJI_FONT}`;g.textAlign='center';g.textBaseline='middle';g.fillText(e,s/2,s/2+px*0.07);spriteCache.set(k,c);return c;}
function drawEmoji(e,x,y,size,flip=false,alpha=1){const px=Math.max(8,Math.min(512,Math.round(size*RES/4)*4));const c=sprite(e,px);const d=size*1.4;
  if(!flip&&alpha===1){ctx.drawImage(c,x-d/2,y-d/2,d,d);return;}
  ctx.save();ctx.globalAlpha*=alpha;ctx.translate(x,y);if(flip)ctx.scale(-1,1);ctx.drawImage(c,-d/2,-d/2,d,d);ctx.restore();}
function label(text,x,y,size=11,color='#fff'){ctx.font=`800 ${size}px ${'"Baloo 2","Comic Sans MS",sans-serif'}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=size*0.35;ctx.strokeStyle='rgba(40,25,60,.85)';ctx.lineJoin='round';ctx.strokeText(text,x,y);ctx.fillStyle=color;ctx.fillText(text,x,y);}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// ================= sound =================
let AC=null,muted=false;
function tone(f,d=0.12,type='sine',v=0.07,slide=0,delay=0){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+0.03);}catch(e){}}
function noise(d=0.8,v=0.25){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*d,buf=AC.createBuffer(1,n,AC.sampleRate),ch=buf.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=AC.createBufferSource();s.buffer=buf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=400;const g=AC.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();}catch(e){}}
const SFX={
  pick(){tone(880,.08,'sine',.07);tone(1320,.1,'sine',.06,0,.06)},
  talk(){tone(540,.06,'triangle',.05)},
  hit(){tone(220,.18,'square',.05,-140)},
  heal(){tone(660,.12,'sine',.06);tone(990,.16,'sine',.06,0,.08)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.08,0,i*.12))},
  unlock(){[784,988,1175,1568].forEach((f,i)=>tone(f,.18,'sine',.07,0,i*.09))},
  lose(){[440,392,330].forEach((f,i)=>tone(f,.25,'triangle',.06,0,i*.18))},
  fly(){tone(300,.3,'sine',.05,500)},
  boat(){tone(200,.25,'sine',.05,100)},
  thunder(){noise(1.2,.35)},
  zap(){tone(1200,.12,'sawtooth',.03,-800)},
};

// ================= data =================
const T=32,MW=600,MH=580;
const CROPS={
  carrot:{e:'🥕',n:'Carrot',heal:20}, strawberry:{e:'🍓',n:'Strawberry',heal:15}, tomato:{e:'🍅',n:'Tomato',heal:15},
  corn:{e:'🌽',n:'Corn',heal:20}, apple:{e:'🍎',n:'Apple',heal:18}, watermelon:{e:'🍉',n:'Watermelon',heal:35},
  pumpkin:{e:'🎃',n:'Pumpkin',heal:30}, grapes:{e:'🍇',n:'Grapes',heal:15}, banana:{e:'🍌',n:'Banana',heal:20},
};
// Pets with a "pw" use the shared power engine: hit (damage range), hits, crit, stun (chance), heal, shield, dodge, weak, fx (projectile).
const PETS={
  dog:{e:'🐶',short:'Buddy',name:'Buddy the Dog',power:'Bark Blast',desc:'A giant bark! Often makes the other side too surprised to move.',world:'Your very first friend.'},
  cat:{e:'🐱',short:'Whiskers',name:'Whiskers the Cat',power:'Lucky Purr',desc:'Heals you a little and makes you dodge the next attack.',world:'Always lands on her feet.'},
  blackcat:{e:'🐈',short:'Midnight',name:'Midnight the Cat',power:'Night Swipe',desc:'A sneaky swipe, then you dodge the next attack.',world:'Loves quiet museums and books.'},
  unicorn:{e:'🦄',short:'Sparkle',name:'Sparkle the Unicorn',power:'Rainbow Beam',desc:'A super strong rainbow blast!',world:'Leaves a trail of sparkles.'},
  cheetah:{e:'🐆',badge:'⚡',short:'Zoom',name:'Zoom the Cheetah',power:'Speed Dash',desc:'Zooms in and hits 3 times super fast.',world:'Makes you walk faster!'},
  leopard:{e:'🐆',short:'Spots',name:'Spots the Leopard',power:'Jungle Pounce',desc:'A huge pounce. Sometimes a DOUBLE hit!',world:'Great at climbing.'},
  lion:{e:'🦁',short:'Leo',name:'Leo the Lion',power:"King's Roar",desc:'One of the strongest hits in the game!',world:'King of Savanna Island.'},
  tiger:{e:'🐯',short:'Stripes',name:'Stripes the Tiger',power:'Tiger Roar',desc:'A big hit that also makes the next attack on you weaker.',world:'Hides in the jungle.'},
  fish:{e:'🐠',bubble:true,short:'Bubbles',name:'Bubbles the Fish',power:'Bubble Shield',desc:'Blocks the next 2 attacks.',world:'Floats along in a magic bubble.'},
  penguin:{e:'🐧',short:'Waddles',name:'Waddles the Penguin',power:'Ice Slide',desc:'Slides in and freezes the other side for a turn.',world:'Loves the snow.'},
  bunny:{e:'🐰',short:'Hops',name:'Hops the Bunny',power:'Carrot Heal',desc:'Heals a LOT of your energy.',world:'Hop hop hop!'},
  deer:{e:'🦌',short:'Fern',name:'Fern the Deer',power:'Forest Blessing',desc:'Heals you and adds a shield that blocks one attack.',world:'Gentle and quiet.'},
  fox:{e:'🦊',short:'Rusty',name:'Rusty the Fox',power:'Trick Tail',desc:'A tricky hit that also heals you a little.',world:'Very clever.'},
  kangaroo:{e:'🦘',short:'Boing',name:'Boing the Kangaroo',power:'Boxing Hop',desc:'Two quick boxing punches!',world:'Can hop super high.'},

function describePower(w){const p=[];if(w.hit)p.push((w.hits>1?`${w.hits} quick hits`:'A strong hit')+(w.crit?' that can be a DOUBLE hit':''));if(w.heal)p.push(`heals ${w.heal} energy`);if(w.shield)p.push(`a shield that blocks ${w.shield} attack${w.shield>1?'s':''}`);if(w.dodge)p.push('makes you dodge the next attack');if(w.weak)p.push('makes the next attack on you weaker');if(w.stun)p.push(`${w.stun>=.6?'often':'sometimes'} stuns the other side`);const s=p.join(', ');return s.charAt(0).toUpperCase()+s.slice(1)+'.';}
Object.values(PETS).forEach(p=>{if(p.pw&&!p.desc)p.desc=describePower(p.pw);});

   const school=sp.big||sp.still||sp.crawl?1:2+Math.floor(srng()*5),ph=srng()*6.28,v=(sp.big?.15:sp.crawl?.3:.4+srng()*.5)*(srng()<.5?-1:1);
   for(let m=0;m<school;m++){const ox=m?(srng()-.5)*60:0,oy=m?(srng()-.5)*40:0;SEA_LIFE.push({sp,x:x+ox,y:y+oy,hx:x+ox,hy:y+oy,r:rad,ph:ph+m*.12,v,face:1});}made++;}
 for(let k=0,t=0;k<180&&t<30000;t++){const tx=2+Math.floor(srng()*(MW-4)),ty=2+Math.floor(srng()*(MH-4));if(terr[ty*MW+tx]!==0)continue;CHESTS.push({id:k,x:(tx+.5)*T,y:(ty+.5)*T});k++;}}

const SEA_BOSS={name:'King Chomp',e:'🦈',sea:true,hp:550,atk:[13,19],

{let best=-1;for(let y=60;y<MH-60;y+=3)for(let x=60;x<MW-60;x+=3){if(terr[y*MW+x]!==0)continue;let m=1e9;for(const I of ISLANDS){const d=Math.hypot(x-I.x,y-I.y)-I.r*1.75;if(d<m)m=d;}if(m>best){best=m;SEA_BOSS.tx=x;SEA_BOSS.ty=y;}}
 SEA_BOSS.x=(SEA_BOSS.tx+.5)*T;SEA_BOSS.y=(SEA_BOSS.ty+.5)*T;SEA_BOSS.R=clamp(Math.floor(best-2),5,10);}
const inTrench=(tx,ty)=>Math.hypot(tx-SEA_BOSS.tx,ty-SEA_BOSS.ty)<SEA_BOSS.R;
for(let k=CHESTS.length-1;k>=0;k--){const c=CHESTS[k];if(inTrench(Math.floor(c.x/T),Math.floor(c.y/T)))CHESTS.splice(k,1);}

  const col=['#7fe8ff','#ff8fd0','#b98cff','#7dffb0','#ffe066'][k%5];FLOOR_GEMS.push({id:k,x:(tx+.2+srng()*.6)*T,y:(ty+.2+srng()*.6)*T,col});k++;}

for(let t=0;t<60000&&WRECKS.length<RELICS.length;t++){const tx=8+Math.floor(srng()*(MW-16)),ty=8+Math.floor(srng()*(MH-16));if(inTrench(tx,ty))continue;
  let ok=true;for(let y=-3;y<=3&&ok;y++)for(let x=-4;x<=4;x++)if(terr[(ty+y)*MW+tx+x]!==0){ok=false;break;}if(!ok)continue;

const reduceMotion=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}})();
function killToast(d){if(d&&d.parentNode)d.parentNode.removeChild(d);}
function toast(msg,ms=2600){const box=$('toasts'),d=document.createElement('div');d.className='toast';d.textContent=msg;d.dataset.born=Date.now()+ms;
  const out=`toastOut .4s ease-in ${Math.max(0,ms-400)/1000}s forwards`;d.style.animation=reduceMotion?out.replace('.4s','.01s'):`pop .25s ease-out, ${out}`;
  d.addEventListener('animationend',e=>{if(e.animationName==='toastOut')killToast(d);});
  box.appendChild(d);setTimeout(()=>killToast(d),ms+100);
  while(box.children.length>3)killToast(box.firstElementChild);}

function tileIdx(px,py){const tx=Math.floor(px/T),ty=Math.floor(py/T);if(tx<0||ty<0||tx>=MW||ty>=MH)return -1;return ty*MW+tx;}
function isLandWalk(px,py){const i=tileIdx(px,py);return i>=0&&terr[i]>=2&&!solid[i];}
function isWater(px,py){const i=tileIdx(px,py);return i>=0&&terr[i]<=1;}
const RW=18,RH=12;
function museumBlocked(px,py){const tx=Math.floor(px/T),ty=Math.floor(py/T);if(tx<1||tx>RW-2||ty<2||ty>RH-2)return true;return MUSEUMS[curMuseum].exhibits.some(e=>e.tx===tx&&e.ty===ty);}
function canMove(nx,ny){if(scene==='museum')return !museumBlocked(nx,ny);if(scene==='sea')return isWater(nx,ny);if(P.mode==='fly')return nx>T&&ny>T&&nx<(MW-1)*T&&ny<(MH-1)*T;if(P.mode==='boat')return isWater(nx,ny);return isLandWalk(nx,ny);}
function hasPet(id){return S.pets.includes(id);}
function nearestBoat(maxD){let b=null,bd=maxD;BOATS.forEach(o=>{if(o===P.boat)return;const d=dist(o.x,o.y,P.x,P.y);if(d<bd){bd=d;b=o;}});return b;}
function findLandNear(){for(const r of [1,1.4,1.9]){for(let a=0;a<16;a++){const an=a/16*Math.PI*2;const x=P.x+Math.cos(an)*r*T,y=P.y+Math.sin(an)*r*T;if(isLandWalk(x,y))return{x,y};}}return null;}

function findAct(){
  let best=null,bd=1e9;const take=(d,o)=>{if(d<bd){bd=d;best=o;}};
  if(scene==='sea'){findSeaAct(take);return best;}
  if(scene==='museum'){
    MUSEUMS[curMuseum].exhibits.forEach(e=>{const x=(e.tx+.5)*T,y=(e.ty+.5)*T,d=dist(x,y,P.x,P.y);if(d<52)take(d,{type:'exhibit',o:e,x,y:y-10,label:(e.book?'Read ':'Look at ')+e.n});});
    const dx=(RW/2)*T,dy=(RH-1)*T,d=dist(dx,dy,P.x,P.y);if(d<46)take(d,{type:'exit',x:dx,y:dy-10,label:'Leave the museum'});
    return best;
  }
  if(P.mode==='walk'){
    NPCS.forEach(n=>{const d=dist(n.x,n.y,P.x,P.y);if(d<54)take(d,{type:'npc',o:n,x:n.x,y:n.y-14,label:'Talk to '+n.name});});
    ANIMALS.forEach(a=>{if(a.sea||hasPet(a.pet))return;const d=dist(a.x,a.y,P.x,P.y);if(d<54)take(d,{type:'animal',o:a,x:a.x,y:a.y-14,label:'Meet '+PETS[a.pet].short});});
    BUILDINGS.forEach(b=>{if(!b.door)return;const d=dist(b.door.x,b.door.y,P.x,P.y);if(d<44)take(d,{type:b.k,o:b,x:b.door.x,y:b.door.y-20,label:b.k==='museum'?'Go into '+MUSEUMS[b.museum].name:'Take a nap at home'});});
    if(S.bossAwake&&BOSS){const d=dist(BOSS.x,BOSS.y,P.x,P.y);if(d<70)take(d-20,{type:'boss',x:BOSS.x,y:BOSS.y-36,label:'Face '+BOSS.name+'!'});}
    BOATS.forEach(b=>{const d=dist(b.x,b.y,P.x,P.y);if(d<62)take(d+6,{type:'boat',o:b,x:b.x,y:b.y-26,label:'Get in the boat ⛵'});});
    PLANTS.forEach(p=>{if(!p.ripe)return;const d=dist(p.x,p.y,P.x,P.y);if(d<34)take(d,{type:'plant',o:p,x:p.x,y:p.y-18,label:'Pick '+CROPS[p.type].n});});
  }else if(P.mode==='boat'){
    const l=findLandNear();if(l)best={type:'land',o:l,x:P.x,y:P.y-34,label:'Hop onto land 🏝️'};
  }
  return best;
}

function doAct(a){
  if(!a){if(scene==='sea')surface();else if(P.mode==='boat')dive();return;}
  switch(a.type){
    case 'npc':talkNPC(a.o);break;
    case 'animal':meetAnimal(a.o);break;
    case 'museum':enterMuseum(a.o);break;
    case 'house':S.seen.nap=1;save();say({name:'Home Sweet Home',emoji:'🏠',text:'You and your pets took a cozy nap. Zzz... 😴 Your game is saved!'});break;
    case 'boss':meetBoss();break;
    case 'boat':P.mode='boat';P.boat=a.o;P.x=a.o.x;P.y=a.o.y;SFX.boat();toast(isTouch()?'⛵ All aboard! Out at sea, tap 🌊 Dive to go underwater!':'⛵ All aboard! Out at sea, press E or Q to dive underwater!');break;
    case 'land':P.mode='walk';P.boat=null;P.x=a.o.x;P.y=a.o.y;resetTrail();toast('🏝️ Land ho!');break;
    case 'plant':pickPlant(a.o);break;
    case 'exhibit':readExhibit(a.o);break;
    case 'exit':exitMuseum();break;
    case 'chest':openChest(a.o);break;
    case 'creature':lookCreature(a.o);break;
    case 'seaboss':meetSeaBoss();break;
    case 'wreck':searchWreck(a.o);break;
  }
}

function talkNPC(n){

  }else say({name:n.name,emoji:n.e,text:line});
  if(first)hudDirty=true;
}
function needStatus(need){const parts=[];let ok=true;
  if(need.items)for(const k in need.items){const have=S.inv[k]||0,n=need.items[k];if(have<n)ok=false;parts.push(`${have>=n?'✅':'⬜'} ${CROPS[k].e} ${Math.min(have,n)}/${n} ${CROPS[k].n.toLowerCase()}`);}
  if(need.gems){const g=S.gems||0;if(g<need.gems)ok=false;parts.push(`${g>=need.gems?'✅':'⬜'} 💎 ${Math.min(g,need.gems)}/${need.gems} sea gems`);}
  if(need.wins){if(S.wins<need.wins)ok=false;parts.push(`${S.wins>=need.wins?'✅':'⬜'} ⚔️ ${Math.min(S.wins,need.wins)}/${need.wins} battles won`);}
  if(need.seabook){const r=Object.keys(S.book||{}).length;if(r<need.seabook)ok=false;parts.push(`${r>=need.seabook?'✅':'⬜'} 📘 ${Math.min(r,need.seabook)}/${need.seabook} sea creatures in your Sea Book`);}
  if(need.books){const r=Object.keys(S.read||{}).length;if(r<need.books)ok=false;parts.push(`${r>=need.books?'✅':'⬜'} 📖 ${Math.min(r,need.books)}/${need.books} books read`);}
  return{ok,text:parts.join(' · ')};}
function meetAnimal(a){
  S.talked['pet_'+a.pet]=1;const pd=PETS[a.pet];if(!a.need)return joinPet(a.pet);const st=needStatus(a.need);

    say({name:pd.name,emoji:pd.e,text:`${pd.short} trusts you now! ${gives?`It would love ${gives}.`:''} Ready to be friends?`,choices:[{label:gives?`Give ${gives}`:'Be friends! 💕',fn:()=>{if(a.need.items)for(const k in a.need.items)S.inv[k]-=a.need.items[k];if(a.need.gems)S.gems-=a.need.gems;joinPet(a.pet);}},{label:'Not yet',fn:()=>{}}]});}
  else say({name:pd.name,emoji:pd.e,text:`${a.say||''} ${pd.short} isn't ready to join you yet. It needs: ${st.text}`});
}

const Wt={type:'sunny',t:40,flash:0,flashT:5,clouds:[]};
for(let i=0;i<6;i++)Wt.clouds.push({x:Math.random(),y:Math.random()*.35,s:rand(.7,1.3),v:rand(.004,.01)});
let WP=[],wpType='';
function pickWeather(){const opts=['sunny','sunny','cloudy','rain','storm','snow','fog','windy'];let n;
  if((Wt.type==='rain'||Wt.type==='storm')&&Math.random()<.6)n='rainbow';else{do n=pick(opts);while(n===Wt.type);}
  Wt.type=n;Wt.t=rand(35,60);if(scene!=='title')toast(`${WEATHER[n].e} The weather is now ${WEATHER[n].n.toLowerCase()}!`);hudDirty=true;}
function effWeather(){if(scene==='museum')return 'inside';if(scene==='sea')return 'sea';const I=ISLANDS[curIsland];if(I&&I.biome==='snow'&&['rain','storm','sunny','cloudy','windy'].includes(Wt.type))return 'snow';return Wt.type;}
function weatherUpdate(dt){
  Wt.t-=dt;if(Wt.t<=0)pickWeather();
  const ew=effWeather();if(ew!==wpType){WP=[];wpType=ew;}
  const want={rain:220,storm:340,snow:160,windy:28}[ew]||0;
  while(WP.length<want)WP.push(newPart(ew,true));

// ================= update =================
let time=0,saveT=0;
function update(dt){
  if(scene==='world'||scene==='museum'||scene==='sea'){
    let ax=0,ay=0;
    if(!dlg&&!overlayOpen()){
      if(keys['arrowleft']||keys['a'])ax-=1;if(keys['arrowright']||keys['d'])ax+=1;if(keys['arrowup']||keys['w'])ay-=1;if(keys['arrowdown']||keys['s'])ay+=1;
      ax+=stick.dx;ay+=stick.dy;
      if(Math.hypot(ax,ay)>0.1)dest=null;
      else if(dest){const dx=dest.x-P.x,dy=dest.y-P.y,d=Math.hypot(dx,dy);if(d<5){if(!dest.hold)dest=null;}else{ax=dx/d;ay=dy/d;if(d<24){ax*=Math.max(.3,d/24);ay*=Math.max(.3,d/24);}}}}
    const m=Math.hypot(ax,ay);if(m>1){ax/=m;ay/=m;}
    const ox=P.x,oy=P.y;
    const sp=P.mode==='fly'?440:P.mode==='boat'?380:P.mode==='swim'?240:(hasPet('cheetah')?200:160);
    P.moving=m>0.1;
    if(P.moving){const mx=ax*sp*dt,my=ay*sp*dt;
      if(canMove(P.x+mx,P.y))P.x+=mx;if(canMove(P.x,P.y+my))P.y+=my;
      if(Math.abs(ax)>0.2)P.face=ax>0?1:-1;P.step+=dt*10;}
    if(dest&&P.moving){if(dist(ox,oy,P.x,P.y)<sp*dt*.15){dest.stuck+=dt;if(dest.stuck>.35&&!dest.hold)dest=null;}else dest.stuck=0;}
    if(P.boat){P.boat.x=P.x;P.boat.y=P.y;P.boat.face=P.face;}
    P.alt+=((P.mode==='fly'?1:0)-P.alt)*Math.min(1,dt*6);
    // trail
    const L=P.trail[0];if(!L||dist(L.x,L.y,P.x,P.y)>3){P.trail.unshift({x:P.x,y:P.y});if(P.trail.length>240)P.trail.pop();}
    pets.forEach((p,i)=>{let tx,ty;
      if(P.mode==='boat'){const offs=[[-14,-2],[14,-2],[-6,8],[8,8],[-20,6],[20,6],[0,-10],[-12,12],[12,12]];const o=offs[i%offs.length];tx=P.x+o[0]*P.face;ty=P.y+o[1]-2;}
      else{const tp=P.trail[Math.min(P.trail.length-1,(i+1)*8)]||P;tx=tp.x;ty=tp.y;}
      const k=1-Math.exp(-(P.mode==='boat'?14:8)*dt);const ox=p.x;p.x+=(tx-p.x)*k;p.y+=(ty-p.y)*k;if(Math.abs(p.x-ox)>0.3)p.face=p.x>ox?1:-1;p.moving=Math.abs(p.x-ox)+Math.abs(ty-p.y)>0.5;
      if(id_isUnicorn(p)&&p.moving&&Math.random()<.3)sparkles.push({x:p.x+rand(-6,6),y:p.y+rand(-4,4),t:0.8,c:pick(['#ff6fa8','#ffd93d','#6be3ff','#b28dff'])});});
    // auto-pick
    if(scene==='world'&&P.mode==='walk')PLANTS.forEach(p=>{if(p.ripe&&dist(p.x,p.y,P.x,P.y)<20)pickPlant(p);});
    if(scene==='sea')for(const g of FLOOR_GEMS){if(S.floorGems[g.id]||Math.abs(g.x-P.x)>26||Math.abs(g.y-P.y)>26)continue;if(dist(g.x,g.y,P.x,P.y)<24){S.floorGems[g.id]=1;S.gems=(S.gems||0)+1;SFX.pick();hudDirty=true;toast(`💎 +1 sea gem! (${S.gems})`,1400);}}
    nearAct=(dlg||overlayOpen())?null:findAct();
    if(dest&&dest.th&&sameAct(dest.th,nearAct)){const a=nearAct;dest=null;doAct(a);}
    updateTouchBtns();
    // island
    if(scene==='world'){const i=tileIdx(P.x,P.y);curIsland=i>=0?isl[i]:-1;if(curIsland>=0&&terr[i]<2&&P.mode!=='walk'){/* in shallows still counts */}
      if(curIsland!==lastIsland){if(curIsland>=0&&lastIsland!==-2){toast(`🏝️ ${ISLANDS[curIsland].name}`);}lastIsland=curIsland;hudDirty=true;}}
  }else dest=null;
  // plants regrow
  const grow=(Wt.type==='rain'||Wt.type==='storm')?2:1;
  PLANTS.forEach(p=>{if(!p.ripe){p.t-=dt*grow;if(p.t<=0)p.ripe=true;}});
  CRITTERS.forEach(c=>{c.ph+=dt*(c.air?1.2:0.4);c.x=c.hx+Math.cos(c.ph)*c.r*(c.air?.8:1);c.y=c.hy+Math.sin(c.ph*1.3)*c.r*.5;});
  sparkles.forEach(s=>s.t-=dt);sparkles=sparkles.filter(s=>s.t>0);
  if(scene!=='title')weatherUpdate(dt);
  if(scene==='battle'&&B)battleUpdate(dt);
  hudT-=dt;if(scene!=='title'&&(hudDirty||hudT<=0)){hudDirty=false;hudT=.5;updateHUD();sweepToasts();}
  saveT+=dt;if(saveT>8&&(scene==='world')){saveT=0;if(P.mode==='walk')save();}
}

const RACE=7,TEAM_MAX=4,SNACK_MAX=3,PET_REST=4;

function teamPets(){const t=(S.team||[]).filter(hasPet);return (t.length?t:S.pets).slice(0,TEAM_MAX);}
const bossHP=()=>BOSS.hp+S.bossBonus+Math.floor(S.bossBeaten/BOSSES.length)*400;
function startBattle(opp){
  const boss=opp.bossObj||(opp.boss?BOSS:null),lvl=opp.lvl||8;
  const hp=boss?(boss.sea?seaBossHP():bossHP()):80+lvl*35+Math.min(S.wins,15)*6;
  const atk=boss?boss.atk.slice():[5+lvl*3,9+lvl*3];
  B={from:scene,opp,boss,lvl,ename:opp.name,ee:opp.e,ehp:hp,emax:hp,atk,hp:S.maxE,max:S.maxE,team:teamPets(),cd:{},shield:0,dodge:false,stun:0,weak:0,rescued:false,busy:false,over:false,
     fx:[],eShake:0,pShake:0,hop:{},turn:0,menu:null,snacks:0,healed:false,enraged:false,biome:(ISLANDS[curIsland]||ISLANDS[0]).biome,result:null};
  scene='battle';$('hud').classList.add('hidden');$('battleUI').classList.remove('hidden');
  bmsg(boss?`${boss.name} roars! This is a BOSS battle! ${boss.e}`:`${opp.name} wants a battle! Pick a move!`);renderBtns();SFX.zap();
}
function bmsg(t){$('bmsg').textContent=t;}
function layout(){const ph=$('battleUI').offsetHeight||170;const bh=VH-ph;const s=Math.min(VW,bh*1.4);
  return{bh,s,EP:{x:VW*.72,y:bh*.42},PP:{x:VW*.3,y:bh*.8}};}
const PET_OFFS=[[-.15,-.02],[.13,-.05],[-.05,-.15],[-.24,-.12]];
function petPos(i,L){const o=PET_OFFS[i%PET_OFFS.length];return{x:L.PP.x+o[0]*L.s*.9,y:L.PP.y+o[1]*L.s*.9};}
function renderBtns(){
  const box=$('bbtns');box.innerHTML='';if(!B)return;
  const add=(html,cls,fn,dis)=>{const b=document.createElement('button');b.className='bbtn '+(cls||'');b.innerHTML=html;b.disabled=!!dis;b.onclick=fn;box.appendChild(b);return b;};
  if(B.over){add(B.result==='win'?'🏆 Yay! Back to adventure ▶':'💕 Back to adventure ▶','main',endBattle);return;}
  if(B.menu==='snack'){const items=Object.keys(CROPS).filter(k=>S.inv[k]>0);
    items.forEach(k=>add(`${CROPS[k].e} ${CROPS[k].n} ×${S.inv[k]}<span class="p">+${CROPS[k].heal} energy</span>`,'snack',()=>playerAction('snack',k),B.busy));
    add('↩ Back','',()=>{B.menu=null;renderBtns();});return;}
  add('💦 Splash Attack<span class="p">your own move</span>','main',()=>playerAction('splash'),B.busy);
  B.team.forEach(id=>{const p=PETS[id],cd=B.cd[id]||0;add(`${p.e} ${p.power}<span class="p">${cd?`resting… ${cd}`:p.short}</span>`,'',()=>playerAction('pet',id),B.busy||cd>0);});
  const n=Object.keys(CROPS).reduce((a,k)=>a+(S.inv[k]||0),0),left=SNACK_MAX-B.snacks;
  add(`🧺 Snack<span class="p">${!n?'no snacks':left<=0?'too full!':left+' left this battle'}</span>`,'snack',()=>{B.menu='snack';renderBtns();},B.busy||!n||left<=0);
}
function fxText(t,x,y,c){B.fx.push({k:'text',t,x,y,c,life:1.2,age:0});}
function fxBurst(x,y,cols,n=18){for(let i=0;i<n;i++){const a=Math.random()*6.3,v=rand(60,220);B.fx.push({k:'dot',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:pick(cols),life:rand(.5,1),age:0});}}
function shoot(e,from,to,dur=.5,size=40){return new Promise(r=>{B.fx.push({k:'proj',e,x0:from.x,y0:from.y,x1:to.x,y1:to.y,age:0,life:dur,size,done:r});});}
function hitEnemy(n,crit){const L=layout();B.ehp=Math.max(0,B.ehp-n);B.eShake=.4;fxText((crit?'DOUBLE! ':'')+'-'+n,L.EP.x,L.EP.y-L.s*.12,crit?'#ffc53d':'#ff5e57');fxBurst(L.EP.x,L.EP.y,['#fff','#ffd93d','#ff8fb1']);SFX.hit();}
function healMe(n){const L=layout();const h=Math.min(n,B.max-B.hp);B.hp+=h;fxText('+'+h,L.PP.x,L.PP.y-L.s*.12,'#2fbf71');fxBurst(L.PP.x,L.PP.y,['#7dffb0','#fff','#b6ffcf']);SFX.heal();}
function petFrom(id){const L=layout();const i=Math.max(0,B.team.indexOf(id));B.hop[id]=.5;return petPos(i,L);}
const POWERS={
  dog:async()=>{const L=layout();await shoot('💥',petFrom('dog'),L.EP,.45);hitEnemy(ri(20,26));if(!B.boss&&Math.random()<.5){B.stun=1;bmsg('WOOF! The other side is too surprised to move!');}},
  cat:async()=>{petFrom('cat');await wait(300);healMe(25);B.dodge=true;bmsg('Purrr... You feel lucky! You will dodge the next attack. 🍀');},
  blackcat:async()=>{const L=layout();await shoot('🌙',petFrom('blackcat'),L.EP,.4);hitEnemy(ri(22,28));B.dodge=true;bmsg('Night Swipe! Midnight hides you in the shadows. You will dodge the next attack!');},
  unicorn:async()=>{const L=layout();await shoot('🌈',petFrom('unicorn'),L.EP,.6,56);hitEnemy(ri(35,45));fxBurst(L.EP.x,L.EP.y,['#ff5e57','#feca57','#48dbfb','#a55eea','#2ecc71'],30);},
  cheetah:async()=>{const L=layout();for(let k=0;k<3;k++){await shoot('⚡',petFrom('cheetah'),L.EP,.22,34);hitEnemy(ri(9,13));}},
  leopard:async()=>{const L=layout();await shoot('🐾',petFrom('leopard'),L.EP,.45,44);const c=Math.random()<.3;hitEnemy(ri(25,32)*(c?2:1),c);},
  lion:async()=>{const L=layout();await shoot('👑',petFrom('lion'),L.EP,.5,52);hitEnemy(ri(40,50));},
  tiger:async()=>{const L=layout();await shoot('🐯',petFrom('tiger'),L.EP,.45,50);hitEnemy(ri(30,38));B.weak=1;bmsg('Tiger Roar! The other side is scared and will hit softer next time!');},
  fish:async()=>{petFrom('fish');await wait(300);B.shield=2;const L=layout();fxBurst(L.PP.x,L.PP.y,['#9fe3ff','#ffffff','#5fd3ea'],24);SFX.heal();bmsg('Bubble Shield! It will block the next 2 attacks! 💧');},
  penguin:async()=>{const L=layout();await shoot('❄️',petFrom('penguin'),L.EP,.45);hitEnemy(ri(18,24));B.stun=1;bmsg('Ice Slide! The other side is frozen for a turn! ❄️');},
  bunny:async()=>{petFrom('bunny');await wait(300);healMe(45);},
  deer:async()=>{petFrom('deer');await wait(300);healMe(20);B.shield=Math.max(B.shield,1);bmsg('Forest Blessing! You healed, and a leaf shield will block the next attack. 🍃');},
  fox:async()=>{const L=layout();await shoot('🍂',petFrom('fox'),L.EP,.4);hitEnemy(ri(20,26));healMe(12);},
  kangaroo:async()=>{const L=layout();for(let k=0;k<2;k++){await shoot('🥊',petFrom('kangaroo'),L.EP,.3,38);hitEnemy(ri(12,16));}},
  koala:async()=>{const L=layout();await shoot('🎵',petFrom('koala'),L.EP,.5);if(Math.random()<.6){B.stun=1;bmsg('Sleepy Song... the other side fell asleep! 💤');}else{hitEnemy(10);bmsg('Sleepy Song... they yawned, but stayed awake!');}},
  dragon:async()=>{const L=layout();await shoot('🌟',petFrom('dragon'),L.EP,.55,60);hitEnemy(ri(55,70));fxBurst(L.EP.x,L.EP.y,['#ffd93d','#ff9f43','#fff'],30);},
  octopus:async()=>{const L=layout();await shoot('💧',petFrom('octopus'),L.EP,.5,52);hitEnemy(ri(35,42));B.stun=1;bmsg('Ink Splash! The other side can\'t see and loses a turn!');},
  rex:async()=>{const L=layout();await shoot('💥',petFrom('rex'),L.EP,.5,64);hitEnemy(ri(70,85));fxBurst(L.EP.x,L.EP.y,['#9bd16b','#fff','#ffd93d'],30);},
};
async function runSpec(id){const p=PETS[id],w=p.pw||{},L=layout(),from=petFrom(id);
  if(w.hit){const n=w.hits||1;for(let k=0;k<n;k++){await shoot(w.fx||p.e,from,L.EP,n>1?.25:.45,n>1?34:46);const c=w.crit&&Math.random()<w.crit;hitEnemy(ri(w.hit[0],w.hit[1])*(c?2:1),c);}}
  else await wait(300);
  const got=[];
  if(w.heal)healMe(w.heal);
  if(w.shield){B.shield=Math.max(B.shield,w.shield);got.push(`a shield for ${w.shield} attack${w.shield>1?'s':''} 🛡️`);}
  if(w.dodge){B.dodge=true;got.push('a lucky dodge 🍀');}
  if(w.weak){B.weak=1;got.push('the next attack on you will be weaker');}
  if(w.stun&&Math.random()<w.stun){B.stun=1;got.push('the other side is stunned 💫');}
  if(got.length)bmsg(`${p.power}! ${got.join(', ')}!`);}
async function playerAction(kind,arg){
  if(!B||B.busy||B.over)return;B.busy=true;B.menu=null;renderBtns();
  const L=layout();
  if(kind==='splash'){bmsg(`${S.name} used Splash Attack!`);await shoot('💦',L.PP,L.EP,.45);hitEnemy(ri(10,16));}
  else if(kind==='pet'){const p=PETS[arg];bmsg(`${p.short} used ${p.power}!`);await (POWERS[arg]?POWERS[arg]():runSpec(arg));B.cd[arg]=PET_REST;}
  else if(kind==='snack'){S.inv[arg]--;B.snacks++;bmsg(`You ate a ${CROPS[arg].n.toLowerCase()}. Yum! ${CROPS[arg].e}`);B.fx.push({k:'proj',e:CROPS[arg].e,x0:L.PP.x,y0:L.PP.y-80,x1:L.PP.x,y1:L.PP.y,age:0,life:.4,size:36,done:()=>{}});await wait(400);healMe(CROPS[arg].heal);}
  await wait(650);
  if(B.ehp<=0)return win();
  await enemyTurn();
}
// Each incoming hit can be blocked by a shield, dodged, or lands.
function takeHit(dmg){const L=layout();
  if(B.shield>0){B.shield--;fxText('Blocked!',L.PP.x,L.PP.y-L.s*.12,'#4fc3f7');bmsg('Your shield blocked it! 💧');}
  else if(B.dodge){B.dodge=false;fxText('Dodged!',L.PP.x,L.PP.y-L.s*.12,'#b28dff');bmsg('You dodged it! 🍀');}
  else{B.hp=Math.max(0,B.hp-dmg);B.pShake=.4;fxText('-'+dmg,L.PP.x,L.PP.y-L.s*.12,'#ff5e57');SFX.hit();}}
async function enemyTurn(){
  B.turn++;const L=layout();
  if(B.stun>0){B.stun=0;if(B.boss&&Math.random()<.5){bmsg(`${B.ename} shook it off! Bosses are tough! 💪`);await wait(1000);}else{bmsg(`${B.ename} can't move this turn!`);await wait(1000);return endRound();}}
  // bosses get angry once, when half beaten
  if(B.boss&&!B.enraged&&B.ehp<=B.emax/2){B.enraged=true;B.atk=B.atk.map(v=>Math.round(v*1.3));const h=Math.round(B.emax*.1);B.ehp=Math.min(B.emax,B.ehp+h);B.eShake=.6;
    fxText('+'+h,L.EP.x,L.EP.y-L.s*.12,'#2fbf71');bmsg(`${B.ename} is ANGRY! 😡 It healed a little and now hits harder!`);SFX.thunder();await wait(1500);}
  // regular battlers can eat one snack when they get low
  if(!B.boss&&!B.healed&&B.ehp<B.emax*.4&&Math.random()<.5){B.healed=true;const h=Math.round(B.emax*.2);B.ehp=Math.min(B.emax,B.ehp+h);
    fxText('+'+h,L.EP.x,L.EP.y-L.s*.12,'#2fbf71');bmsg(`${B.ename} ate a snack and healed! 🍪`);await wait(1200);return endRound();}
  const sp=B.boss&&B.turn%B.boss.special.every===0?B.boss.special:null;let mv;
  if(sp)mv={...sp,dmg:ri(sp.dmg[0],sp.dmg[1])};
  else if(!B.boss&&B.lvl>=4&&B.turn%4===0)mv={n:'Power Throw',e:'☄️',dmg:Math.round(ri(B.atk[0],B.atk[1])*1.6)};
  else{const m=pick(B.boss?B.boss.moves:MOVES);mv={...m,dmg:ri(B.atk[0],B.atk[1])};}
  if(B.weak){mv.dmg=Math.round(mv.dmg*.6);B.weak=0;}
  bmsg(`${B.ename} used ${mv.n}!${sp?' 😱':''}`);await wait(450);
  const hits=mv.double?2:1;
  for(let h=0;h<hits&&B.hp>0;h++){await shoot(mv.e,L.EP,L.PP,.45,B.boss?54:40);takeHit(mv.dmg);if(h<hits-1)await wait(250);}
  if(mv.freeze&&B.hp>0){B.team.forEach(id=>B.cd[id]=Math.max(B.cd[id]||0,2));await wait(500);bmsg('Brrr! Ink Blizzard froze all your pets for a turn! ❄️');}
  await wait(750);
  if(B.hp<=0){if(!B.rescued){await rescue();if(B.ehp<=0)return win();}else return lose();}
  endRound();
}
async function rescue(){
  B.rescued=true;const L=layout();const n=B.team.length;
  bmsg('Oh no, you fainted! 😵 ...But wait! Your animals are rushing in to help!');await wait(1500);
  for(let k=0;k<10;k++)B.fx.push({k:'proj',e:'💖',x0:petPos(k%n,L).x,y0:petPos(k%n,L).y,x1:L.PP.x+rand(-30,30),y1:L.PP.y+rand(-30,10),age:-k*.06,life:.6,size:26,done:()=>{}});
  await wait(800);B.hp=0;healMe(Math.round(B.max*.45));bmsg('Your pets gave you a big hug! You got back up! 💖');await wait(1100);
  bmsg('TEAM POWER! All your animals attack together!');
  for(const id of B.team){if(B.ehp<=0)break;const from=petFrom(id);await shoot(PETS[id].e,from,L.EP,.3,40);hitEnemy(ri(10,15));}
  B.cd={};B.shield=Math.max(B.shield,1);await wait(700);
  if(B.ehp>0)bmsg('Your animals have your back! All powers are ready, plus a shield! But this is your last chance!');
  await wait(1100);
}
function endRound(){if(!B||B.over)return;for(const k in B.cd)if(B.cd[k]>0)B.cd[k]--;B.busy=false;bmsg('Your turn! What will you do?');renderBtns();}
function win(){
  B.over=true;B.result='win';SFX.win();const L=layout();for(let k=0;k<4;k++)setTimeout(()=>B&&fxBurst(rand(VW*.2,VW*.8),rand(50,L.bh*.6),['#ff5fa2','#ffc53d','#7b5cff','#2fbf71','#48dbfb'],30),k*250);
  S.wins++;S.maxE=Math.min(220,S.maxE+4);
  const rewards=[];for(let k=0;k<(B.boss?6:2);k++){const c=pick(Object.keys(CROPS));S.inv[c]=(S.inv[c]||0)+1;rewards.push(CROPS[c].e);}
  B.notes=[];
  if(B.boss&&B.boss.sea){const b=B.boss;S.seaBossBeaten++;const g=10;S.gems=(S.gems||0)+g;
    B.notes.push({name:b.name,emoji:b.e,text:b.winText});
    if(!hasPet(b.reward)){addPet(b.reward);const pd=PETS[b.reward];B.notes.push({name:pd.name,emoji:pd.e,text:`${pd.name} joined your team! Power: ${pd.power}. ${pd.desc}`});}
    B.notes.push({name:'Ocean Champion!',emoji:'🏆',text:`${S.name}, you beat King Chomp! You got ${g} sea gems 💎. He wants a rematch, and he'll be even stronger next time (${seaBossHP()} energy)!`});
    bmsg(`🏆 YOU BEAT KING CHOMP! You got ${rewards.join(' ')} and ${g} 💎!`);
  }else if(B.boss){const b=B.boss;S.bossBeaten++;S.bossAwake=false;S.race={you:0,rival:0};S.bossBonus=0;
    B.notes.push({name:b.name,emoji:b.e,text:b.winText});
    if(!hasPet(b.reward)){addPet(b.reward);const pd=PETS[b.reward];B.notes.push({name:pd.name,emoji:pd.e,text:`${pd.name} joined your team! Power: ${pd.power}. ${pd.desc}`});}
    refreshBoss();
    B.notes.push({name:'Champion!',emoji:'🏆',text:`${S.name}, you beat ${b.name}! Win ${RACE} more battles to wake the next boss: ${BOSS.name} ${BOSS.e}. It is even stronger!`});
    bmsg(`🏆 YOU BEAT ${b.name.toUpperCase()}! You got ${rewards.join(' ')}!`);
  }else{
    if(!S.bossAwake)S.race.you=Math.min(RACE,S.race.you+1);
    if(S.race.you>=RACE&&!S.bossAwake){S.bossAwake=true;B.notes.push({name:'Wizard Ember',emoji:'🧙',text:BOSS.wake});}
    const left=RACE-S.race.you;
    bmsg(`🏆 You won! You got ${rewards.join(' ')} and +4 max energy! ${S.bossAwake?`${BOSS.name} is waiting!`:`⭐ ${left} more win${left===1?'':'s'} to wake the boss!`}`);
    const ready=ANIMALS.filter(a=>!hasPet(a.pet)&&a.need&&a.need.wins===S.wins).map(a=>PETS[a.pet]);
    if(ready.length)B.notes.push({name:'New friends?',emoji:ready[0].e,text:`${S.wins} wins! ${ready.map(p=>p.short).join(' and ')} might trust you now. Check your backpack 🎒 to see what else they need.`});
  }
  save();renderBtns();
}
function lose(){
  B.over=true;B.result='lose';SFX.lose();S.losses++;B.notes=[];
  S.race.rival++;
  if(S.race.rival>=RACE){S.race.rival=0;S.bossBonus+=150;B.notes.push({name:'Rival Team Thunder',emoji:'🌩️',text:`Rival Team Thunder reached ${BOSS.name} first! They didn't win, but now ${BOSS.name} is even stronger. (+150 energy)`});}
  bmsg(`${B.ename} won this time. Your pets cuddle you, you're all better! 🌩️ Rivals are ${S.race.rival===0?'starting over':(RACE-S.race.rival)+' wins away from the boss'}.`);
  save();renderBtns();
}
function endBattle(){const notes=B.notes||[];const from=B.from;B=null;scene=from==='sea'?'sea':'world';$('battleUI').classList.add('hidden');$('hud').classList.remove('hidden');hudDirty=true;notes.forEach(n=>say(n));}
function battleUpdate(dt){B.eShake=Math.max(0,B.eShake-dt);B.pShake=Math.max(0,B.pShake-dt);for(const k in B.hop)B.hop[k]=Math.max(0,B.hop[k]-dt);
  B.fx.forEach(f=>{f.age+=dt;if(f.k==='dot'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=300*dt;}if(f.k==='proj'&&f.age>=f.life&&!f.fired){f.fired=true;f.done&&f.done();}});
  B.fx=B.fx.filter(f=>f.age<f.life||(f.k==='proj'&&!f.fired));}
function drawBattle(){
  ctx.setTransform(DPR,0,0,DPR,0,0);RES=DPR;const L=layout(),bi=BIOME[B.biome],boss=B.boss;
  const sky=boss?boss.sky:bi.sky;
  const g=ctx.createLinearGradient(0,0,0,L.bh);g.addColorStop(0,sky[0]);g.addColorStop(1,sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle=boss?boss.ground:bi.ground;ctx.beginPath();ctx.ellipse(VW/2,L.bh*1.05,VW*.85,L.bh*.5,0,Math.PI,0);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.14)';ctx.beginPath();ctx.ellipse(L.EP.x,L.EP.y+L.s*.1,L.s*.17,L.s*.045,0,0,6.3);ctx.fill();ctx.beginPath();ctx.ellipse(L.PP.x,L.PP.y+L.s*.08,L.s*.22,L.s*.05,0,0,6.3);ctx.fill();
  // enemy
  const es=boss?L.s*.3:L.s*.2;const ex=L.EP.x+Math.sin(B.eShake*60)*B.eShake*20,ey=L.EP.y+Math.sin(time*2)*4;
  if(boss){const col=B.enraged?'rgba(220,30,30,':'rgba(80,0,110,';const gg=ctx.createRadialGradient(ex,ey,5,ex,ey,es);gg.addColorStop(0,col+'.5)');gg.addColorStop(1,col+'0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(ex,ey,es,0,6.3);ctx.fill();}
  if(B.over&&B.result==='win'&&boss)drawEmoji(PETS[boss.reward].e,ex,ey,es*.6);
  else drawEmoji(B.ee,ex,ey,es,false,B.over&&B.result==='win'?.4:1);
  if(B.enraged&&!B.over)drawEmoji('😡',ex+es*.4,ey-es*.45,es*.22);
  if(B.stun)drawEmoji('💫',ex,ey-es*.6,es*.3);
  // player + team
  B.team.forEach((id,i)=>{const p=petPos(i,L),h=(B.hop[id]||0);const y=p.y-Math.sin(h*Math.PI*2)*30*(h>0?1:0)-Math.abs(Math.sin(time*3+i))*3;const pd=PETS[id];const sz=L.s*.1;
    if(pd.bubble){ctx.fillStyle='rgba(160,230,255,.35)';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,y,sz*.62,0,6.3);ctx.fill();ctx.stroke();}
    drawEmoji(pd.e,p.x,y,sz,true,(B.cd[id]||0)>0?.55:1);if(pd.badge)drawEmoji(pd.badge,p.x+sz*.4,y-sz*.4,sz*.4);});
  const px=L.PP.x+Math.sin(B.pShake*60)*B.pShake*20,py=L.PP.y+Math.sin(time*2.4)*3;
